<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Person – Realistic Grey Baseplate</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 20px;
            pointer-events: none;
            font-size: 14px;
            backdrop-filter: blur(6px);
            user-select: none;
            z-index: 100;
            transition: opacity 0.3s;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 200;
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="info">WASD to move • Mouse to look • Esc to unlock</div>
    <div id="crosshair"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { AfterimagePass } from 'three/addons/postprocessing/AfterimagePass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        // --- Camera ---
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 1.7, 5);

        // --- Renderer ---
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        // --- Controls ---
        const controls = new PointerLockControls(camera, renderer.domElement);
        
        document.body.addEventListener('click', () => {
            controls.lock();
        });

        controls.addEventListener('lock', () => {
            document.getElementById('info').style.opacity = '0';
        });
        controls.addEventListener('unlock', () => {
            document.getElementById('info').style.opacity = '1';
        });

        // --- Post Processing (Motion Blur via AfterimagePass + FXAA) ---
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        // AfterimagePass creates the motion blur / trail effect
        const afterimagePass = new AfterimagePass(0.82); // damp: 0 = none, 1 = infinite
        composer.addPass(afterimagePass);

        // FXAA for anti-aliasing
        const fxaaPass = new ShaderPass(FXAAShader);
        const pixelRatio = renderer.getPixelRatio();
        fxaaPass.uniforms['resolution'].value.x = 1 / (window.innerWidth * pixelRatio);
        fxaaPass.uniforms['resolution'].value.y = 1 / (window.innerHeight * pixelRatio);
        composer.addPass(fxaaPass);

        // --- Sky Sphere ---
        function createSky() {
            const skyGeo = new THREE.SphereGeometry(1000, 32, 15);
            const skyMat = new THREE.ShaderMaterial({
                uniforms: {
                    topColor: { value: new THREE.Color(0x0077ff) },
                    bottomColor: { value: new THREE.Color(0x87CEEB) },
                    offset: { value: 33 },
                    exponent: { value: 0.6 }
                },
                vertexShader: `
                    varying vec3 vWorldPosition;
                    void main() {
                        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                        vWorldPosition = worldPosition.xyz;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform vec3 topColor;
                    uniform vec3 bottomColor;
                    uniform float offset;
                    uniform float exponent;
                    varying vec3 vWorldPosition;
                    void main() {
                        float h = normalize(vWorldPosition + offset).y;
                        gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0);
                    }
                `,
                side: THREE.BackSide,
                depthWrite: false
            });
            const sky = new THREE.Mesh(skyGeo, skyMat);
            scene.add(sky);
        }
        createSky();

        // --- Clouds ---
        function createClouds() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'white';
            const circles = [
                {x: 90, y: 150, r: 60},
                {x: 150, y: 130, r: 70},
                {x: 200, y: 150, r: 50},
                {x: 120, y: 180, r: 45},
                {x: 170, y: 180, r: 55}
            ];
            circles.forEach(c => {
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.beginPath();
            ctx.arc(130, 190, 40, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(180, 190, 35, 0, Math.PI * 2);
            ctx.fill();
            
            const texture = new THREE.CanvasTexture(canvas);
            const cloudMat = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                opacity: 0.9,
                depthWrite: false,
                fog: false
            });
            
            const cloudPositions = [
                {x: -150, y: 80, z: -200, scale: 60},
                {x: 100, y: 100, z: -250, scale: 80},
                {x: 200, y: 60, z: -150, scale: 50},
                {x: -250, y: 120, z: -100, scale: 70},
                {x: 50, y: 90, z: 250, scale: 65},
                {x: -100, y: 110, z: 300, scale: 75},
                {x: 300, y: 70, z: 50, scale: 55},
                {x: -300, y: 100, z: 150, scale: 60},
                {x: 150, y: 85, z: -350, scale: 90},
                {x: -200, y: 130, z: 400, scale: 85},
                {x: 400, y: 65, z: -300, scale: 70},
                {x: -400, y: 95, z: -200, scale: 80}
            ];
            
            cloudPositions.forEach(pos => {
                const sprite = new THREE.Sprite(cloudMat);
                sprite.position.set(pos.x, pos.y, pos.z);
                sprite.scale.set(pos.scale, pos.scale * 0.6, 1);
                scene.add(sprite);
            });
        }
        createClouds();

        // --- Sun ---
        function createSun() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
            gradient.addColorStop(0, 'rgba(255, 255, 240, 1)');
            gradient.addColorStop(0.3, 'rgba(255, 255, 200, 0.9)');
            gradient.addColorStop(0.6, 'rgba(255, 230, 120, 0.5)');
            gradient.addColorStop(1, 'rgba(255, 200, 50, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 256, 256);
            
            const texture = new THREE.CanvasTexture(canvas);
            const sunMat = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                fog: false
            });
            
            const sun = new THREE.Sprite(sunMat);
            sun.position.set(300, 400, -500);
            sun.scale.set(300, 300, 1);
            scene.add(sun);
        }
        createSun();

        // --- Lighting ---
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        scene.add(hemiLight);

        const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.3);
        sunLight.position.set(300, 400, -500);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        const d = 100;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        sunLight.shadow.camera.near = 1;
        sunLight.shadow.camera.far = 1000;
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);

        const fillLight = new THREE.PointLight(0x557799, 0.2);
        fillLight.position.set(-5, 0, 5);
        scene.add(fillLight);

        // --- Baseplate ---
        const baseplateWidth = 400;
        const baseplateDepth = 400;
        
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#888888';
        ctx.fillRect(0, 0, 512, 512);
        for (let i = 0; i < 15000; i++) {
            const x = Math.random() * 512;
            const y = Math.random() * 512;
            const b = 100 + Math.random() * 60;
            ctx.fillStyle = `rgb(${b}, ${b}, ${b})`;
            ctx.fillRect(x, y, 1, 1);
        }
        for (let i = 0; i < 500; i++) {
            const x = Math.random() * 512;
            const y = Math.random() * 512;
            const r = 5 + Math.random() * 20;
            const g = 120 + Math.random() * 40;
            ctx.fillStyle = `rgba(${g}, ${g}, ${g}, 0.2)`;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
        }
        
        const baseplateTexture = new THREE.CanvasTexture(canvas);
        baseplateTexture.wrapS = THREE.RepeatWrapping;
        baseplateTexture.wrapT = THREE.RepeatWrapping;
        baseplateTexture.repeat.set(20, 20);
        
        const baseplateMaterial = new THREE.MeshStandardMaterial({
            map: baseplateTexture,
            roughness: 0.9,
            metalness: 0.05
        });
        
        const baseplateGeometry = new THREE.PlaneGeometry(baseplateWidth, baseplateDepth);
        const baseplate = new THREE.Mesh(baseplateGeometry, baseplateMaterial);
        baseplate.rotation.x = -Math.PI / 2;
        baseplate.receiveShadow = true;
        scene.add(baseplate);

        // Grid overlay
        const gridHelper = new THREE.GridHelper(400, 100, 0xaaaaaa, 0x999999);
        gridHelper.position.y = 0.01;
        gridHelper.material.opacity = 0.15;
        gridHelper.material.transparent = true;
        scene.add(gridHelper);

        // --- Movement State ---
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const speed = 8.0;

        const keys = { w: false, a: false, s: false, d: false };

        window.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'KeyW': keys.w = true; break;
                case 'KeyA': keys.a = true; break;
                case 'KeyS': keys.s = true; break;
                case 'KeyD': keys.d = true; break;
            }
        });

        window.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': keys.w = false; break;
                case 'KeyA': keys.a = false; break;
                case 'KeyS': keys.s = false; break;
                case 'KeyD': keys.d = false; break;
            }
        });

        // --- Head Bobbing ---
        let bobTime = 0;
        const bobAmplitude = 0.08;
        const bobFrequency = 12;
        const eyeHeight = 1.7;
        let currentEyeHeight = eyeHeight;

        // --- Resize Handler ---
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            composer.setSize(w, h);
            const pr = renderer.getPixelRatio();
            fxaaPass.uniforms['resolution'].value.x = 1 / (w * pr);
            fxaaPass.uniforms['resolution'].value.y = 1 / (h * pr);
        });

        // --- Animation Loop ---
        let prevTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);
            prevTime = time;

            if (controls.isLocked) {
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                forward.y = 0;
                forward.normalize();

                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                right.y = 0;
                right.normalize();

                direction.set(0, 0, 0);
                if (keys.w) direction.add(forward);
                if (keys.s) direction.sub(forward);
                if (keys.d) direction.add(right);
                if (keys.a) direction.sub(right);

                if (direction.lengthSq() > 0) direction.normalize();

                velocity.copy(direction).multiplyScalar(speed * delta);

                const newPosition = camera.position.clone().add(velocity);
                const limit = 195;
                newPosition.x = Math.max(-limit, Math.min(limit, newPosition.x));
                newPosition.z = Math.max(-limit, Math.min(limit, newPosition.z));

                const isMoving = direction.lengthSq() > 0.01;
                
                if (isMoving) {
                    bobTime += delta * bobFrequency;
                    const bobOffset = Math.sin(bobTime) * bobAmplitude;
                    currentEyeHeight += ((eyeHeight + bobOffset) - currentEyeHeight) * 10 * delta;
                } else {
                    currentEyeHeight += (eyeHeight - currentEyeHeight) * 10 * delta;
                }

                newPosition.y = currentEyeHeight;
                camera.position.copy(newPosition);
            }

            // Render with composer (motion blur + FXAA)
            composer.render();
        }

        animate();
        console.log('Click to start walking. Use WASD and mouse.');
    </script>
</body>
</html>
