<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Person – Grey Baseplate</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 20px;
            pointer-events: none;
            font-size: 14px;
            backdrop-filter: blur(4px);
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="info">WASD to move • Mouse to look around</div>

    <!-- Import Three.js and PointerLockControls from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122); // dark night sky for contrast

        // --- Camera ---
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.7, 5); // eye height ~1.7m

        // --- Renderer ---
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = false; // not needed for flat grey baseplate
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- Controls (Pointer Lock) ---
        const controls = new PointerLockControls(camera, renderer.domElement);
        
        // Click to lock pointer (start)
        document.body.addEventListener('click', () => {
            controls.lock();
        });

        // Optional: show/hide instructions or handle unlock
        controls.addEventListener('lock', () => {
            document.getElementById('info').style.display = 'none';
        });
        controls.addEventListener('unlock', () => {
            document.getElementById('info').style.display = 'block';
        });

        // --- Lighting ---
        // Ambient light to softly illuminate everything
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        // Directional light for slight shading definition
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = false;
        scene.add(dirLight);

        // Optional fill light from below to reduce harsh shadows
        const fillLight = new THREE.PointLight(0x557799, 0.3);
        fillLight.position.set(-5, 0, 5);
        scene.add(fillLight);

        // --- Grey Baseplate ---
        // Using a large PlaneGeometry rotated to be horizontal.
        // Size: 30x30 units gives plenty of space to walk around.
        const baseplateWidth = 30;
        const baseplateDepth = 30;
        const baseplateGeometry = new THREE.PlaneGeometry(baseplateWidth, baseplateDepth);
        const baseplateMaterial = new THREE.MeshStandardMaterial({
            color: 0x888888,
            roughness: 0.8,
            metalness: 0.1,
            side: THREE.DoubleSide // so it's visible if we look from below (though unlikely)
        });
        const baseplate = new THREE.Mesh(baseplateGeometry, baseplateMaterial);
        baseplate.rotation.x = -Math.PI / 2; // make it horizontal (facing up)
        baseplate.position.y = 0;
        // Add a subtle grid helper to give a sense of scale and movement
        // but keep the baseplate grey – we can add a grid on top with low opacity
        scene.add(baseplate);

        // --- Grid Helper (transparent, to make movement visible) ---
        const gridHelper = new THREE.GridHelper(30, 30, 0xcccccc, 0xaaaaaa);
        gridHelper.position.y = 0.01; // slightly above baseplate to avoid z-fighting
        scene.add(gridHelper);

        // --- Simple boundary walls (invisible barriers via collision logic) ---
        // We'll implement movement boundaries in the animation loop.
        // But for visual reference, we can add subtle corner markers or not.
        // Nothing extra for now to keep it minimal.

        // --- Movement State ---
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const speed = 5.0; // units per second

        // Keyboard state
        const keys = {
            w: false,
            a: false,
            s: false,
            d: false
        };

        window.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'KeyW': keys.w = true; break;
                case 'KeyA': keys.a = true; break;
                case 'KeyS': keys.s = true; break;
                case 'KeyD': keys.d = true; break;
            }
        });

        window.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': keys.w = false; break;
                case 'KeyA': keys.a = false; break;
                case 'KeyS': keys.s = false; break;
                case 'KeyD': keys.d = false; break;
            }
        });

        // --- Window Resize Handler ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Animation Loop ---
        let prevTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1); // cap delta to avoid jumps
            prevTime = time;

            if (controls.isLocked) {
                // --- Movement (WASD) ---
                // Get forward direction from camera (yaw only, ignore pitch)
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                forward.y = 0;
                forward.normalize();

                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                right.y = 0;
                right.normalize();

                // Reset direction
                direction.set(0, 0, 0);

                if (keys.w) direction.add(forward);
                if (keys.s) direction.sub(forward);
                if (keys.d) direction.add(right);
                if (keys.a) direction.sub(right);

                if (direction.lengthSq() > 0) {
                    direction.normalize();
                }

                // Apply velocity
                velocity.copy(direction).multiplyScalar(speed * delta);

                // Move camera
                const newPosition = camera.position.clone().add(velocity);

                // Boundary constraints (stay within baseplate area)
                // Baseplate extends from -15 to +15 in X and Z
                const limit = 14.5; // leave a small margin
                newPosition.x = Math.max(-limit, Math.min(limit, newPosition.x));
                newPosition.z = Math.max(-limit, Math.min(limit, newPosition.z));

                // Keep Y fixed (eye height)
                newPosition.y = 1.7;

                camera.position.copy(newPosition);
            }

            renderer.render(scene, camera);
        }

        // Start animation
        animate();

        // Small initial hint in console
        console.log('Click to start walking. Use WASD and mouse.');
    </script>
</body>
</html>
