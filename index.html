<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nectar 🍑</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍑</text></svg>" />
</head>
<body>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-icon">🍑</span>
      <span class="brand-name">Nectar</span>
    </div>

    <nav class="nav">
      <a href="#" class="nav-item active">🏠 <span>Home</span></a>
      <a href="#" class="nav-item">🔍 <span>Explore</span></a>
      <a href="#" class="nav-item">🔔 <span>Notifications</span></a>
      <a href="#" class="nav-item">👤 <span>Profile</span></a>
      <a href="#" class="nav-item">⚙️ <span>Settings</span></a>
    </nav>

    <button class="btn-primary sidebar-cta">Drop a Nectar</button>
  </aside>

  <!-- ===== MAIN FEED ===== -->
  <main class="feed">
    <h1 class="page-title">Home</h1>

    <!-- Composer -->
    <section class="composer">
      <textarea id="post-input" placeholder="What's sweet today?" rows="3"></textarea>
      <div class="composer-actions">
        <div class="composer-icons">🖼️ 😊</div>
        <button id="post-btn" class="btn-primary">Drop 🍑</button>
      </div>
    </section>

    <!-- Posts render here -->
    <section id="feed-list" class="feed-list"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
