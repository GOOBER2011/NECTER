<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze — Horror Prototype</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #000; }
        #overlay {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: radial-gradient(circle at center, rgba(0,0,0,0.45), rgba(0,0,0,0.92));
            color: white; cursor: pointer; z-index: 200;
            transition: opacity 0.3s ease; text-align: center; padding: 20px; user-select: none;
        }
        #overlay.hidden { opacity: 0; pointer-events: none; }
        #overlay h1 { font-size: 46px; margin: 0 0 12px; letter-spacing: 8px; font-weight: 200; }
        #overlay p { font-size: 14px; opacity: 0.75; margin: 4px 0; }
        #overlay .kbd {
            display: inline-block; padding: 2px 8px; margin: 0 2px;
            background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
            border-radius: 4px; font-size: 12px; font-family: monospace;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 4px; height: 4px; margin: -2px 0 0 -2px;
            border-radius: 50%; background: rgba(255,255,255,0.9);
            pointer-events: none; z-index: 150; display: none;
            box-shadow: 0 0 4px rgba(0,0,0,0.8);
        }
        #crosshair.visible { display: block; }
        #hud {
            position: absolute; bottom: 16px; left: 16px;
            color: rgba(255,255,255,0.85);
            font-size: 12px; pointer-events: none; z-index: 100;
            display: none; text-shadow: 0 1px 3px rgba(0,0,0,0.9);
            font-family: monospace; letter-spacing: 0.5px;
        }
        #hud.visible { display: block; }
        #flashlightIndicator {
            position: absolute; bottom: 16px; right: 16px;
            color: rgba(255,255,220,0.9); font-size: 12px;
            font-family: monospace; letter-spacing: 1px;
            pointer-events: none; z-index: 100;
            display: none; text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }
        #flashlightIndicator.visible { display: block; }
        #flashlightIndicator.on { color: #fff6a8; }
        #loading {
            position: absolute; inset: 0; display: flex;
            align-items: center; justify-content: center;
            background: #0a0a0a; color: #fff; z-index: 300;
            font-size: 13px; letter-spacing: 6px;
            transition: opacity 0.6s ease;
        }
        #loading.hidden { opacity: 0; pointer-events: none; }
        #errorMsg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #ff8888; background: rgba(0,0,0,0.9); padding: 16px 28px;
            border-radius: 8px; font-size: 13px; z-index: 400; display: none;
            text-align: center; max-width: 600px; line-height: 1.6;
            font-family: monospace; white-space: pre-wrap;
        }
        #errorMsg.visible { display: block; }
    </style>
</head>
<body>
    <div id="loading">LOADING</div>
    <div id="overlay" style="display:none">
        <h1>MAZE</h1>
        <p><span class="kbd">W</span><span class="kbd">A</span><span class="kbd">S</span><span class="kbd">D</span> to move</p>
        <p><span class="kbd">Shift</span> sprint · <span class="kbd">C</span> crouch · <span class="kbd">F</span> flashlight</p>
        <p style="margin-top:16px;opacity:0.5">Click anywhere to begin</p>
    </div>
    <div id="crosshair"></div>
    <div id="hud">WASD · SHIFT sprint · C crouch · F flashlight · ESC release</div>
    <div id="flashlightIndicator">FLASHLIGHT: OFF</div>
    <div id="errorMsg"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        window.addEventListener('error', (e) => {
            const err = document.getElementById('errorMsg');
            const load = document.getElementById('loading');
            if (err && load) {
                load.classList.add('hidden');
                err.textContent = 'Error: ' + (e.message || e.error || 'unknown') + '\n\n' + (e.filename || '') + ':' + (e.lineno || '');
                err.classList.add('visible');
            }
        });

        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // ============================================================
        // CONSTANTS
        // ============================================================
        const MAZE_W = 15;
        const MAZE_H = 15;
        const CELL_SIZE = 5.0;
        const WALL_THICK = 0.4;
        const WALL_HEIGHT = 3.2;

        const STAND_HEIGHT = 1.7;
        const CROUCH_HEIGHT = 1.0;
        let eyeHeight = STAND_HEIGHT;

        const halfW = (MAZE_W - 1) / 2;
        const halfH = (MAZE_H - 1) / 2;
        const cellWorldX = (cx) => (cx - halfW) * CELL_SIZE;
        const cellWorldZ = (cz) => (cz - halfH) * CELL_SIZE;

        // ============ RENDERER ============
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.55;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        // ============ SCENE ============
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x080808);
        scene.fog = new THREE.FogExp2(0x080808, 0.04);

        // ============ CAMERA RIG ============
        const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.05, 300);
        camera.position.set(0, 0, 0);

        const cameraRig = new THREE.Object3D();
        cameraRig.add(camera);
        scene.add(cameraRig);

        // ============ LIGHTING ============
        const hemi = new THREE.HemisphereLight(0x3a4a5a, 0x1a1510, 0.4);
        scene.add(hemi);

        // ============ FLASHLIGHT ============
        const flashlightHolder = new THREE.Object3D();
        camera.add(flashlightHolder);

        const flashlight = new THREE.SpotLight(0xfff2cc, 0, 80, Math.PI / 7, 0.4, 1.0);
        flashlight.position.set(0.15, -0.15, 0.1);
        flashlight.target.position.set(0, 0, -10);
        flashlight.distance = 100;
        flashlight.decay = 0.8; 
        
        flashlightHolder.add(flashlight);
        flashlightHolder.add(flashlight.target);

        let flashlightOn = false;
        let flashlightTargetIntensity = 0;

        const lastCameraQuat = new THREE.Quaternion();
        const targetHolderQuat = new THREE.Quaternion();

        // ============ MAZE GRID ============
        const wallsH = [];
        const wallsV = [];
        for (let z = 0; z <= MAZE_H; z++) wallsH.push(new Array(MAZE_W).fill(true));
        for (let z = 0; z < MAZE_H; z++) wallsV.push(new Array(MAZE_W + 1).fill(true));

        function generateMaze() {
            const visited = [];
            for (let z = 0; z < MAZE_H; z++) visited.push(new Array(MAZE_W).fill(false));
            visited[0][0] = true;

            function carve(x, z) {
                const dirs = [
                    { dx: 0, dz: -1, wall: 'N' }, { dx: 1, dz: 0, wall: 'E' },
                    { dx: 0, dz: 1, wall: 'S' }, { dx: -1, dz: 0, wall: 'W' }
                ];
                for (let i = dirs.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
                }
                for (const d of dirs) {
                    const nx = x + d.dx;
                    const nz = z + d.dz;
                    if (nx < 0 || nx >= MAZE_W || nz < 0 || nz >= MAZE_H) continue;
                    if (visited[nz][nx]) continue;
                    visited[nz][nx] = true;

                    if (d.wall === 'N') wallsH[z][x] = false;
                    if (d.wall === 'S') wallsH[z + 1][x] = false;
                    if (d.wall === 'W') wallsV[z][x] = false;
                    if (d.wall === 'E') wallsV[z][x + 1] = false;

                    carve(nx, nz);
                }
            }
            carve(0, 0);
        }
        generateMaze();

        // ============ CARVE POCKETS INTO WALLS ============
        const pockets = [];
        let pocketsCreated = 0;
        
        // Try to place 15 pockets
        for (let attempts = 0; attempts < 1000 && pocketsCreated < 15; attempts++) {
            const isHorizontal = Math.random() > 0.5;
            if (isHorizontal) {
                const z = Math.floor(Math.random() * (MAZE_H - 1)); 
                const x = Math.floor(Math.random() * MAZE_W);
                
                // We want to carve into the South wall of a cell, pointing North
                if (wallsH[z + 1][x]) {
                    if (!pockets.some(p => p.x === x && p.z === z && p.axis === 'H')) {
                        pockets.push({
                            axis: 'H', x, z,
                            wx: cellWorldX(x),
                            wz: cellWorldZ(z) + CELL_SIZE / 2, // Position of the wall face
                            dir: -1 // pocket extends backwards into the wall (North)
                        });
                        pocketsCreated++;
                    }
                }
            } else {
                const z = Math.floor(Math.random() * MAZE_H);
                const x = Math.floor(Math.random() * (MAZE_W - 1));
                
                // We want to carve into the East wall of a cell, pointing West
                if (wallsV[z][x + 1]) {
                    if (!pockets.some(p => p.x === x && p.z === z && p.axis === 'V')) {
                        pockets.push({
                            axis: 'V', x, z,
                            wx: cellWorldX(x) + CELL_SIZE / 2, // Position of the wall face
                            wz: cellWorldZ(z),
                            dir: -1 // pocket extends backwards into the wall (West)
                        });
                        pocketsCreated++;
                    }
                }
            }
        }

        // ============ WALL TEXTURES ============
        function makeWallTextures() {
            const S = 512;
            const c = document.createElement('canvas');
            c.width = c.height = S;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#6e6a63';
            ctx.fillRect(0, 0, S, S);
            const img = ctx.getImageData(0, 0, S, S);
            const d = img.data;
            for (let i = 0; i < d.length; i += 4) {
                const n = (Math.random() - 0.5) * 45;
                d[i] = Math.max(0, Math.min(255, d[i] + n));
                d[i+1] = Math.max(0, Math.min(255, d[i+1] + n));
                d[i+2] = Math.max(0, Math.min(255, d[i+2] + n));
            }
            ctx.putImageData(img, 0, 0);

            ctx.strokeStyle = 'rgba(30,28,25,0.55)';
            ctx.lineWidth = 3;
            const courseH = S / 8;
            for (let i = 0; i <= 8; i++) {
                ctx.beginPath(); ctx.moveTo(0, i * courseH); ctx.lineTo(S, i * courseH); ctx.stroke();
            }
            ctx.strokeStyle = 'rgba(35,32,28,0.4)';
            ctx.lineWidth = 2;
            const brickW = S / 6;
            for (let row = 0; row < 8; row++) {
                const y = row * courseH;
                const offset = (row % 2) * (brickW / 2);
                for (let i = 0; i < 6; i++) {
                    const x = i * brickW + offset;
                    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + courseH); ctx.stroke();
                }
            }

            const grimeGrad = ctx.createLinearGradient(0, S, 0, S/2);
            grimeGrad.addColorStop(0, 'rgba(20,30,20,0.4)');
            grimeGrad.addColorStop(1, 'rgba(20,30,20,0)');
            ctx.fillStyle = grimeGrad;
            ctx.fillRect(0, 0, S, S);

            for (let i = 0; i < 40; i++) {
                const x = Math.random() * S;
                const y = S * 0.7 + Math.random() * S * 0.3;
                const r = 10 + Math.random() * 40;
                const g = ctx.createRadialGradient(x, y, 0, x, y, r);
                g.addColorStop(0, `rgba(40,60,30,${0.1 + Math.random() * 0.2})`);
                g.addColorStop(1, 'rgba(40,60,30,0)');
                ctx.fillStyle = g;
                ctx.fillRect(x - r, y - r, r * 2, r * 2);
            }

            for (let i = 0; i < 80; i++) {
                const x = Math.random() * S;
                const y = Math.random() * S;
                const r = 10 + Math.random() * 60;
                const g = ctx.createRadialGradient(x, y, 0, x, y, r);
                g.addColorStop(0, `rgba(0,0,0,${0.05 + Math.random() * 0.08})`);
                g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = g;
                ctx.fillRect(x - r, y - r, r * 2, r * 2);
            }

            const colorTex = new THREE.CanvasTexture(c);
            colorTex.wrapS = colorTex.wrapT = THREE.RepeatWrapping;
            colorTex.repeat.set(1, 1);
            colorTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
            colorTex.colorSpace = THREE.SRGBColorSpace;

            const nCanvas = document.createElement('canvas');
            nCanvas.width = nCanvas.height = 512;
            const nctx = nCanvas.getContext('2d');
            nctx.fillStyle = '#8080ff';
            nctx.fillRect(0, 0, 512, 512);
            nctx.strokeStyle = 'rgba(90,90,255,1)';
            nctx.lineWidth = 4;
            for (let i = 0; i <= 8; i++) {
                nctx.beginPath(); nctx.moveTo(0, i * (512/8)); nctx.lineTo(512, i * (512/8)); nctx.stroke();
            }
            nctx.strokeStyle = 'rgba(110,110,255,1)';
            nctx.lineWidth = 3;
            for (let row = 0; row < 8; row++) {
                const y = row * (512 / 8);
                const offset = (row % 2) * (512 / 12);
                for (let i = 0; i < 6; i++) {
                    const x = i * (512 / 6) + offset;
                    nctx.beginPath(); nctx.moveTo(x, y); nctx.lineTo(x, y + 512 / 8); nctx.stroke();
                }
            }
            const normalTex = new THREE.CanvasTexture(nCanvas);
            normalTex.wrapS = normalTex.wrapT = THREE.RepeatWrapping;
            normalTex.repeat.set(1, 1);
            return { colorTex, normalTex };
        }

        const wallTextures = makeWallTextures();
        const wallMat = new THREE.MeshStandardMaterial({
            map: wallTextures.colorTex,
            normalMap: wallTextures.normalTex,
            normalScale: new THREE.Vector2(1.2, 1.2),
            color: 0x9a948a,
            roughness: 0.92,
            metalness: 0.03,
            envMapIntensity: 0.2
        });

        // ============ MAZE WALLS ============
        const wallTransforms = [];
        for (let z = 0; z <= MAZE_H; z++) {
            for (let x = 0; x < MAZE_W; x++) {
                if (!wallsH[z][x]) continue;
                const wx = cellWorldX(x);
                const wz = z === 0 ? cellWorldZ(0) - CELL_SIZE / 2
                         : z === MAZE_H ? cellWorldZ(MAZE_H - 1) + CELL_SIZE / 2
                         : cellWorldZ(z - 1) + CELL_SIZE / 2;
                wallTransforms.push({ x: wx, y: WALL_HEIGHT / 2, z: wz, sx: CELL_SIZE + WALL_THICK, sy: WALL_HEIGHT, sz: WALL_THICK });
            }
        }
        for (let z = 0; z < MAZE_H; z++) {
            for (let x = 0; x <= MAZE_W; x++) {
                if (!wallsV[z][x]) continue;
                const wx = x === 0 ? cellWorldX(0) - CELL_SIZE / 2
                         : x === MAZE_W ? cellWorldX(MAZE_W - 1) + CELL_SIZE / 2
                         : cellWorldX(x - 1) + CELL_SIZE / 2;
                const wz = cellWorldZ(z);
                wallTransforms.push({ x: wx, y: WALL_HEIGHT / 2, z: wz, sx: WALL_THICK, sy: WALL_HEIGHT, sz: CELL_SIZE + WALL_THICK });
            }
        }

        const wallGeo = new THREE.BoxGeometry(1, 1, 1);
        const instancedWalls = new THREE.InstancedMesh(wallGeo, wallMat, wallTransforms.length);
        instancedWalls.castShadow = true;
        instancedWalls.receiveShadow = true;

        const _m = new THREE.Matrix4();
        const _p = new THREE.Vector3();
        const _q = new THREE.Quaternion();
        const _s = new THREE.Vector3();
        for (let i = 0; i < wallTransforms.length; i++) {
            const t = wallTransforms[i];
            _p.set(t.x, t.y, t.z);
            _s.set(t.sx, t.sy, t.sz);
            _m.compose(_p, _q, _s);
            instancedWalls.setMatrixAt(i, _m);
        }
        instancedWalls.instanceMatrix.needsUpdate = true;
        scene.add(instancedWalls);

        // ============ POCKET GEOMETRY & LANTERNS ============
        const lanternMat = new THREE.MeshStandardMaterial({ 
            color: 0x111111, emissive: 0xffaa44, emissiveIntensity: 2.0, roughness: 0.8 
        });

        for (const pocket of pockets) {
            const pocketGroup = new THREE.Group();
            
            const pocketW = 1.4;
            const pocketH = 1.2;
            const pocketD = 1.4; // Depth of the recess

            // The walls of the recess (built to go inward)
            const wallGeo = new THREE.BoxGeometry(pocketW, pocketH, WALL_THICK);
            const sideGeo = new THREE.BoxGeometry(WALL_THICK, pocketH, pocketD);
            const topGeo = new THREE.BoxGeometry(pocketW, WALL_THICK, pocketD);
            const floorGeo = new THREE.BoxGeometry(pocketW, WALL_THICK, pocketD);

            // Back wall (furthest inside)
            const back = new THREE.Mesh(wallGeo, wallMat);
            back.position.set(0, pocketH/2, -pocketD/2);
            back.castShadow = true;
            back.receiveShadow = true;
            pocketGroup.add(back);

            // Left wall
            const left = new THREE.Mesh(sideGeo, wallMat);
            left.position.set(-pocketW/2, pocketH/2, -pocketD/4);
            left.castShadow = true;
            left.receiveShadow = true;
            pocketGroup.add(left);

            // Right wall
            const right = new THREE.Mesh(sideGeo, wallMat);
            right.position.set(pocketW/2, pocketH/2, -pocketD/4);
            right.castShadow = true;
            right.receiveShadow = true;
            pocketGroup.add(right);

            // Ceiling (Low ceiling forces crouching)
            const top = new THREE.Mesh(topGeo, wallMat);
            top.position.set(0, pocketH, -pocketD/4);
            top.castShadow = true;
            top.receiveShadow = true;
            pocketGroup.add(top);

            // Floor of the recess (flush with main floor)
            const rFloor = new THREE.Mesh(floorGeo, wallMat);
            rFloor.position.set(0, 0.01, -pocketD/4);
            rFloor.receiveShadow = true;
            pocketGroup.add(rFloor);

            // Lantern on the back wall
            const lantern = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.25, 0.15), lanternMat);
            lantern.position.set(0, pocketH/2, -pocketD/2 + 0.2);
            pocketGroup.add(lantern);

            // Point Light for the lantern
            const lanternLight = new THREE.PointLight(0xffaa55, 2.0, 4);
            lanternLight.position.copy(lantern.position);
            pocketGroup.add(lanternLight);

            // Position the whole pocket group at the wall face
            pocketGroup.position.set(pocket.wx, 0, pocket.wz);
            
            if (pocket.axis === 'H') {
                // If H, it extends North (-Z). Opening faces South (+Z).
                pocketGroup.rotation.y = 0; 
            } else {
                // If V, it extends West (-X). Opening faces East (+X).
                pocketGroup.rotation.y = Math.PI / 2;
            }

            scene.add(pocketGroup);
        }

        // ============ CEILING ============
        function makeCeilingTexture() {
            const S = 512;
            const c = document.createElement('canvas');
            c.width = c.height = S;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#4a4844';
            ctx.fillRect(0, 0, S, S);
            const img = ctx.getImageData(0, 0, S, S);
            const d = img.data;
            for (let i = 0; i < d.length; i += 4) {
                const n = (Math.random() - 0.5) * 30;
                d[i] = Math.max(0, Math.min(255, d[i] + n));
                d[i+1] = Math.max(0, Math.min(255, d[i+1] + n));
                d[i+2] = Math.max(0, Math.min(255, d[i+2] + n));
            }
            ctx.putImageData(img, 0, 0);
            ctx.strokeStyle = 'rgba(20,18,15,0.5)';
            ctx.lineWidth = 4;
            for (let i = 0; i <= 4; i++) {
                const p = i * (S / 4);
                ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, S); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(S, p); ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set((MAZE_W * CELL_SIZE) / 5, (MAZE_H * CELL_SIZE) / 5);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        const ceilingGeo = new THREE.PlaneGeometry(MAZE_W * CELL_SIZE + 4, MAZE_H * CELL_SIZE + 4);
        const ceiling = new THREE.Mesh(ceilingGeo, new THREE.MeshStandardMaterial({ 
            map: makeCeilingTexture(), color: 0x5a5753, roughness: 0.95, metalness: 0.02, side: THREE.DoubleSide 
        }));
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = WALL_HEIGHT + 0.05;
        ceiling.receiveShadow = true;
        scene.add(ceiling);

        // ============ CEILING PIPES ============
        const pipeMat = new THREE.MeshStandardMaterial({ color: 0x4a3b2e, roughness: 0.7, metalness: 0.6 });
        const pipeGeo = new THREE.CylinderGeometry(0.08, 0.08, 100, 8);
        pipeGeo.rotateZ(Math.PI / 2);
        for (let i = 0; i < 4; i++) {
            const pipe = new THREE.Mesh(pipeGeo, pipeMat);
            pipe.position.set(0, WALL_HEIGHT - 0.2, -30 + i * 20);
            pipe.rotation.y = Math.PI / 2;
            scene.add(pipe);
        }

        // ============ FLOOR ============
        function makeGroundTexture() {
            const S = 1024;
            const c = document.createElement('canvas');
            c.width = c.height = S;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#6a6a6a';
            ctx.fillRect(0, 0, S, S);
            const img = ctx.getImageData(0, 0, S, S);
            const d = img.data;
            for (let i = 0; i < d.length; i += 4) {
                const n = (Math.random() - 0.5) * 40;
                d[i] = Math.max(0, Math.min(255, d[i] + n));
                d[i+1] = Math.max(0, Math.min(255, d[i+1] + n));
                d[i+2] = Math.max(0, Math.min(255, d[i+2] + n));
            }
            ctx.putImageData(img, 0, 0);
            ctx.strokeStyle = 'rgba(40,40,40,0.7)';
            ctx.lineWidth = 4;
            const step = S / 8;
            for (let i = 0; i <= 8; i++) {
                ctx.beginPath(); ctx.moveTo(i*step, 0); ctx.lineTo(i*step, S); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i*step); ctx.lineTo(S, i*step); ctx.stroke();
            }
            for (let i = 0; i < 150; i++) {
                const x = Math.random() * S, y = Math.random() * S;
                const r = 20 + Math.random() * 80;
                const g = ctx.createRadialGradient(x, y, 0, x, y, r);
                g.addColorStop(0, `rgba(20,20,20,${0.02 + Math.random() * 0.05})`);
                g.addColorStop(1, 'rgba(20,20,20,0)');
                ctx.fillStyle = g;
                ctx.fillRect(x - r, y - r, r * 2, r * 2);
            }
            const colorTex = new THREE.CanvasTexture(c);
            colorTex.wrapS = colorTex.wrapT = THREE.RepeatWrapping;
            colorTex.repeat.set(20, 20);
            colorTex.colorSpace = THREE.SRGBColorSpace;
            return colorTex;
        }

        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({ 
            map: makeGroundTexture(), color: 0x808080, roughness: 1.0 
        }));
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // ============ SPAWN PLAYER ============
        cameraRig.position.set(cellWorldX(0), STAND_HEIGHT, cellWorldZ(0));

        // Updated Collision checking for pockets
        function isInsideWall(x, z, padding = 0.35) {
            const gx = (x / CELL_SIZE) + halfW + 0.5;
            const gz = (z / CELL_SIZE) + halfH + 0.5;
            const cellX = Math.floor(gx);
            const cellZ = Math.floor(gz);
            const fx = gx - cellX;
            const fz = gz - cellZ;
            const padFrac = padding / CELL_SIZE;

            // Check if we are inside a pocket (if so, we are safe from wall collision)
            for (const p of pockets) {
                if (p.axis === 'H') {
                    const px = Math.abs(p.wx - x);
                    const pz = p.wz - z;
                    // If within the width and depth of the pocket
                    if (px < 0.8 && pz > -0.1 && pz < 1.5) return false;
                } else {
                    const px = p.wx - x;
                    const pz = Math.abs(p.wz - z);
                    if (pz < 0.8 && px > -0.1 && px < 1.5) return false;
                }
            }

            // Standard maze walls
            if (fz < padFrac && cellX >= 0 && cellX < MAZE_W && cellZ >= 0 && cellZ <= MAZE_H) {
                if (wallsH[cellZ] && wallsH[cellZ][cellX]) return true;
            }
            if (fz > 1 - padFrac && cellX >= 0 && cellX < MAZE_W && cellZ + 1 >= 0 && cellZ + 1 <= MAZE_H) {
                if (wallsH[cellZ + 1] && wallsH[cellZ + 1][cellX]) return true;
            }
            if (fx < padFrac && cellX >= 0 && cellX <= MAZE_W && cellZ >= 0 && cellZ < MAZE_H) {
                if (wallsV[cellZ] && wallsV[cellZ][cellX]) return true;
            }
            if (fx > 1 - padFrac && cellX + 1 >= 0 && cellX + 1 <= MAZE_W && cellZ >= 0 && cellZ < MAZE_H) {
                if (wallsV[cellZ] && wallsV[cellZ][cellX + 1]) return true;
            }
            return false;
        }

        // ============ DUST PARTICLES ============
        const DUST_COUNT = 4000;
        const dustGeo = new THREE.BufferGeometry();
        const dustPositions = new Float32Array(DUST_COUNT * 3);
        const dustSizes = new Float32Array(DUST_COUNT);
        const dustPhases = new Float32Array(DUST_COUNT);
        const dustSpeeds = new Float32Array(DUST_COUNT);

        const DUST_RANGE_XZ = 25;
        const DUST_RANGE_Y = 3.0;

        for (let i = 0; i < DUST_COUNT; i++) {
            const yBias = Math.pow(Math.random(), 2.0);
            dustPositions[i * 3]     = (Math.random() - 0.5) * DUST_RANGE_XZ * 2;
            dustPositions[i * 3 + 1] = yBias * DUST_RANGE_Y + 0.1;
            dustPositions[i * 3 + 2] = (Math.random() - 0.5) * DUST_RANGE_XZ * 2;
            dustSizes[i] = 0.02 + Math.random() * 0.08;
            dustPhases[i] = Math.random() * Math.PI * 2;
            dustSpeeds[i] = 0.15 + Math.random() * 0.5;
        }

        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
        dustGeo.setAttribute('aSize', new THREE.BufferAttribute(dustSizes, 1));
        dustGeo.setAttribute('aPhase', new THREE.BufferAttribute(dustPhases, 1));
        dustGeo.setAttribute('aSpeed', new THREE.BufferAttribute(dustSpeeds, 1));

        const dustMat = new THREE.ShaderMaterial({
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            uniforms: {
                uTime: { value: 0 },
                uCamPos: { value: new THREE.Vector3() },
                uPixelRatio: { value: renderer.getPixelRatio() },
                uFlashlightPos: { value: new THREE.Vector3() },
                uFlashlightDir: { value: new THREE.Vector3(0, 0, -1) },
                uFlashlightOn: { value: 0 }
            },
            vertexShader: `
                attribute float aSize;
                attribute float aPhase;
                attribute float aSpeed;
                uniform float uTime;
                uniform vec3 uCamPos;
                uniform float uPixelRatio;
                uniform vec3 uFlashlightPos;
                uniform vec3 uFlashlightDir;
                uniform float uFlashlightOn;
                varying float vAlpha;
                varying float vFlashlit;

                void main() {
                    vec3 pos = position;
                    float t = uTime * aSpeed;

                    pos.x += sin(t * 0.8 + aPhase) * 0.6 + cos(t * 1.5 + aPhase * 0.3) * 0.2;
                    pos.z += cos(t * 0.9 + aPhase * 1.2) * 0.6 + sin(t * 1.2 + aPhase * 1.4) * 0.2;
                    pos.y += sin(t * 0.5 + aPhase * 2.1) * 0.3;

                    vec3 camGrid = floor(uCamPos / 25.0) * 25.0;
                    vec3 toCam = pos - camGrid;
                    
                    float wrapR = 25.0;
                    toCam.x = mod(toCam.x + wrapR, wrapR * 2.0) - wrapR;
                    toCam.z = mod(toCam.z + wrapR, wrapR * 2.0) - wrapR;
                    
                    vec3 worldPos = camGrid + toCam;
                    worldPos.y = mod(pos.y, 3.0) + 0.1;

                    float twinkle = 0.7 + 0.3 * sin(t * 2.0 + aPhase * 5.0);

                    vec3 toParticle = normalize(worldPos - uFlashlightPos);
                    float cosAngle = dot(toParticle, normalize(uFlashlightDir));
                    float inCone = smoothstep(0.88, 1.0, cosAngle);
                    float distF = smoothstep(25.0, 2.0, length(worldPos - uFlashlightPos));
                    vFlashlit = uFlashlightOn * inCone * distF;

                    vec4 mvPosition = viewMatrix * vec4(worldPos, 1.0);
                    gl_Position = projectionMatrix * mvPosition;

                    float dist = length(mvPosition.xyz);
                    gl_PointSize = aSize * uPixelRatio * (400.0 / max(dist, 0.5));
                    gl_PointSize = min(gl_PointSize, 24.0 * uPixelRatio);

                    vAlpha = smoothstep(40.0, 5.0, dist) * smoothstep(0.0, 1.0, dist) * twinkle;
                }`,
            fragmentShader: `
                varying float vAlpha;
                varying float vFlashlit;

                void main() {
                    vec2 c = gl_PointCoord - 0.5;
                    float d = length(c);
                    if (d > 0.5) discard;

                    float core = smoothstep(0.5, 0.1, d);
                    float a = core * 0.6;

                    vec3 color = vec3(1.0, 0.95, 0.85);
                    color += vec3(0.8, 0.7, 0.5) * vFlashlit * 3.0;
                    a *= 1.0 + vFlashlit * 4.0;

                    gl_FragColor = vec4(color, a * vAlpha);
                }`
        });

        const dustPoints = new THREE.Points(dustGeo, dustMat);
        dustPoints.frustumCulled = false;
        scene.add(dustPoints);

        // ============ AUDIO SYSTEM ============
        let audioCtx = null;
        let masterGain = null;
        let flashlightClickBuffer = null;
        let footstepReverb = null;
        let footstepSamples = [];
        let currentFootstepSrc = null;
        let currentFootstepGain = null;

        function applyLowpass(arr, cutoffHz, sr) {
            const rc = 1.0 / (2 * Math.PI * cutoffHz);
            const dt = 1.0 / sr;
            const alpha = dt / (rc + dt);
            let prev = 0;
            for (let i = 0; i < arr.length; i++) {
                prev = prev + alpha * (arr[i] - prev);
                arr[i] = prev;
            }
        }

        function generateFootstepSample(seed) {
            const sr = audioCtx.sampleRate;
            const duration = 0.28;
            const len = Math.floor(sr * duration);
            const buf = audioCtx.createBuffer(1, len, sr);
            const data = buf.getChannelData(0);

            let s = seed >>> 0;
            const rand = () => {
                s = (s * 1103515245 + 12345) & 0x7fffffff;
                return s / 0x7fffffff;
            };

            const bodyCutoff = 80 + rand() * 50;
            const soleCutoff = 300 + rand() * 250;
            const bodyDecay  = 22 + rand() * 8;
            const soleDecay  = 38 + rand() * 12;

            const transient = new Float32Array(len);
            for (let i = 0; i < len; i++) transient[i] = rand() * 2 - 1;
            const transLow = new Float32Array(len);
            for (let i = 0; i < len; i++) transLow[i] = transient[i];
            applyLowpass(transLow, 800, sr);
            for (let i = 0; i < len; i++) transient[i] = (transient[i] - transLow[i]) * 0.55;
            for (let i = 0; i < len; i++) {
                const t = i / sr;
                transient[i] *= Math.exp(-t * 650);
            }

            const sole = new Float32Array(len);
            for (let i = 0; i < len; i++) sole[i] = rand() * 2 - 1;
            applyLowpass(sole, soleCutoff, sr);
            applyLowpass(sole, soleCutoff, sr);
            for (let i = 0; i < len; i++) {
                const t = i / sr;
                sole[i] *= Math.exp(-t * soleDecay) * 0.85;
            }

            const body = new Float32Array(len);
            for (let i = 0; i < len; i++) body[i] = rand() * 2 - 1;
            applyLowpass(body, bodyCutoff, sr);
            applyLowpass(body, bodyCutoff, sr);
            applyLowpass(body, bodyCutoff, sr);
            for (let i = 0; i < len; i++) {
                const t = i / sr;
                body[i] *= Math.exp(-t * bodyDecay) * (1 - Math.exp(-t * 300)) * 1.4;
            }

            for (let i = 0; i < len; i++) data[i] = transient[i] + sole[i] + body[i];

            let peak = 0;
            for (let i = 0; i < len; i++) peak = Math.max(peak, Math.abs(data[i]));
            const norm = peak > 0.001 ? 1.0 / peak : 1.0;
            for (let i = 0; i < len; i++) data[i] = Math.tanh(data[i] * norm * 1.3) * 0.85;

            const fadeLen = Math.floor(sr * 0.02);
            for (let i = 0; i < fadeLen; i++) data[len - 1 - i] *= i / fadeLen;

            return buf;
        }

        async function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.85;
            masterGain.connect(audioCtx.destination);

            const sr = audioCtx.sampleRate;
            const dur = 0.18;
            const len = Math.floor(sr * dur);
            const buf = audioCtx.createBuffer(2, len, sr);
            for (let ch = 0; ch < 2; ch++) {
                const d = buf.getChannelData(ch);
                for (let i = 0; i < len; i++) {
                    d[i] = (Math.random() * 2 - 1) * Math.exp(-(i/sr) * 30) * (ch === 0 ? 0.9 : 0.75);
                }
            }
            footstepReverb = audioCtx.createConvolver();
            footstepReverb.buffer = buf;
            footstepReverb.connect(masterGain);

            for (let i = 0; i < 10; i++) footstepSamples.push(generateFootstepSample(0xBEEF + i * 4507));

            const clickBuf = audioCtx.createBuffer(1, Math.floor(sr * 0.12), sr);
            const clickData = clickBuf.getChannelData(0);
            for (let i = 0; i < clickData.length; i++) {
                const t = i / sr;
                const env1 = Math.exp(-t * 200);
                const env2 = t > 0.05 ? Math.exp(-(t - 0.05) * 200) * 0.6 : 0;
                const ping = Math.sin(2 * Math.PI * 2800 * t) * 0.35 + Math.sin(2 * Math.PI * 4200 * t) * 0.2;
                const noise = (Math.random() * 2 - 1) * 0.4;
                clickData[i] = ((noise + ping) * env1) + ((noise * 0.7 + ping) * env2);
            }
            flashlightClickBuffer = clickBuf;
        }

        function stopCurrentFootstep() {
            if (currentFootstepSrc) {
                const now = audioCtx.currentTime;
                try {
                    currentFootstepGain.gain.linearRampToValueAtTime(0, now + 0.02);
                    currentFootstepSrc.stop(now + 0.025);
                } catch (e) { /* ignore */ }
                currentFootstepSrc = null;
                currentFootstepGain = null;
            }
        }

        function playFootstep(sprinting, crouching) {
            if (!audioCtx || footstepSamples.length === 0 || currentFootstepSrc) return;
            const now = audioCtx.currentTime;
            const gain = audioCtx.createGain();
            let vol = 0.10;
            if (crouching) vol = 0.05;
            else if (sprinting) vol = 0.18;
            gain.gain.value = vol * (0.9 + Math.random() * 0.2);
            gain.connect(masterGain);

            const send = audioCtx.createGain();
            send.gain.value = crouching ? 0.06 : (sprinting ? 0.14 : 0.10);
            gain.connect(send);
            send.connect(footstepReverb);

            const buf = footstepSamples[Math.floor(Math.random() * footstepSamples.length)];
            const src = audioCtx.createBufferSource();
            src.buffer = buf;
            src.playbackRate.value = (crouching ? 0.90 : (sprinting ? 1.06 : 1.0)) + (Math.random() - 0.5) * 0.05;
            src.connect(gain);
            
            currentFootstepSrc = src;
            currentFootstepGain = gain;
            src.onended = () => {
                if (currentFootstepSrc === src) {
                    currentFootstepSrc = null;
                    currentFootstepGain = null;
                }
            };
            src.start(now);
        }

        function playFlashlightClick() {
            if (!audioCtx || !flashlightClickBuffer) return;
            const src = audioCtx.createBufferSource();
            src.buffer = flashlightClickBuffer;
            const gain = audioCtx.createGain();
            gain.gain.value = 0.5;
            src.connect(gain);
            gain.connect(masterGain);
            src.start();
        }

        // ============ POST-PROCESSING ============
        const composer = new EffectComposer(renderer);
        composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        composer.addPass(new RenderPass(scene, camera));

        const MotionBlurShader = {
            uniforms: {
                tDiffuse: { value: null },
                uVelocity: { value: new THREE.Vector2(0, 0) },
                uStrength: { value: 0.0 },
                uResolution: { value: new THREE.Vector2(1, 1) }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }`,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform vec2 uVelocity;
                uniform float uStrength;
                uniform vec2 uResolution;
                varying vec2 vUv;
                void main() {
                    if (uStrength < 0.001) {
                        gl_FragColor = texture2D(tDiffuse, vUv);
                        return;
                    }
                    const int SAMPLES = 16;
                    vec2 velocity = uVelocity * uStrength / uResolution;
                    vec2 center = vec2(0.5, 0.5);
                    vec2 toCenter = vUv - center;
                    vec4 sum = vec4(0.0);
                    float total = 0.0;
                    for (int i = 0; i < SAMPLES; i++) {
                        float t = float(i) / float(SAMPLES - 1) - 0.5;
                        vec2 dirOffset = velocity * t;
                        vec2 radOffset = toCenter * uStrength * 0.035 * t;
                        vec2 uv = vUv + dirOffset + radOffset;
                        float w = exp(-t * t * 3.5);
                        sum += texture2D(tDiffuse, uv) * w;
                        total += w;
                    }
                    vec3 color = sum.rgb / total;
                    if (uStrength > 0.3) {
                        vec2 chromaOffset = normalize(velocity + 0.0001) * uStrength * 0.0015;
                        float r = texture2D(tDiffuse, vUv + chromaOffset).r;
                        float b = texture2D(tDiffuse, vUv - chromaOffset).b;
                        color.r = mix(color.r, r, 0.5);
                        color.b = mix(color.b, b, 0.5);
                    }
                    gl_FragColor = vec4(color, 1.0);
                }`
        };
        const motionBlurPass = new ShaderPass(MotionBlurShader);
        motionBlurPass.uniforms.uResolution.value.set(window.innerWidth * renderer.getPixelRatio(), window.innerHeight * renderer.getPixelRatio());
        composer.addPass(motionBlurPass);
        composer.addPass(new OutputPass());

        // ============ POINTER LOCK & STATE ============
        const controls = new PointerLockControls(camera, renderer.domElement);
        const overlay = document.getElementById('overlay');
        const crosshair = document.getElementById('crosshair');
        const hud = document.getElementById('hud');
        const flIndicator = document.getElementById('flashlightIndicator');
        const loading = document.getElementById('loading');

        loading.classList.add('hidden');
        overlay.style.display = 'flex';

        overlay.addEventListener('click', () => controls.lock());
        renderer.domElement.addEventListener('click', () => { if (!controls.isLocked) controls.lock(); });

        controls.addEventListener('lock', async () => {
            overlay.classList.add('hidden');
            crosshair.classList.add('visible');
            hud.classList.add('visible');
            flIndicator.classList.add('visible');
            camera.getWorldQuaternion(lastCameraQuat);
            targetHolderQuat.copy(lastCameraQuat);
            try { await initAudio(); } catch (e) { console.error(e); }
        });
        
        controls.addEventListener('unlock', () => {
            overlay.classList.remove('hidden');
            crosshair.classList.remove('visible');
            hud.classList.remove('visible');
            flIndicator.classList.remove('visible');
            keys.clear();
            stopCurrentFootstep();
        });

        // ============ INPUT ============
        const keys = new Set();
        document.addEventListener('keydown', (e) => {
            if (!controls.isLocked) return;
            if (e.repeat) return;
            keys.add(e.code);
            if (e.code === 'KeyF') toggleFlashlight();
        });
        document.addEventListener('keyup', (e) => keys.delete(e.code));
        window.addEventListener('blur', () => keys.clear());

        function toggleFlashlight() {
            flashlightOn = !flashlightOn;
            flashlightTargetIntensity = flashlightOn ? 22.0 : 0.0;
            flashlight.visible = true;
            playFlashlightClick();
            flIndicator.textContent = flashlightOn ? 'FLASHLIGHT: ON' : 'FLASHLIGHT: OFF';
            flIndicator.classList.toggle('on', flashlightOn);
            dustMat.uniforms.uFlashlightOn.value = flashlightOn ? 1.0 : 0.0;
        }

        // ============ MOVEMENT ============
        const WALK_SPEED = 3.2;
        const RUN_SPEED = 7.0;
        const CROUCH_SPEED = 1.4;
        const ACCEL = 42.0;
        const DECEL = 24.0;
        const PLAYER_RADIUS = 0.35;

        const velocity = new THREE.Vector3();
        const clock = new THREE.Clock();

        let bobTime = 0;
        const BOB_FREQ_WALK = 5.5;
        const BOB_FREQ_RUN = 9.0;
        const BOB_AMP = 0.045;

        let strideDistance = 0;
        const STRIDE_LENGTH_WALK = 1.15;
        const STRIDE_LENGTH_RUN = 1.5;
        const STRIDE_LENGTH_CROUCH = 0.75;

        let currentRoll = 0;
        const MAX_ROLL = 0.08;
        const ROLL_SPEED = 4.0;

        const prevCamWorldPos = new THREE.Vector3();
        const prevCamWorldQuat = new THREE.Quaternion();
        camera.getWorldPosition(prevCamWorldPos);
        camera.getWorldQuaternion(prevCamWorldQuat);

        const screenVelocity = new THREE.Vector2();
        let blurStrength = 0;
        let elapsed = 0;

        const _forwardDir = new THREE.Vector3();
        const _rightDir = new THREE.Vector3();
        const _moveVec = new THREE.Vector3();

        // ============ ANIMATION LOOP ============
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);
            elapsed += dt;

            const crouching = controls.isLocked && (keys.has('KeyC'));
            const targetEyeHeight = crouching ? CROUCH_HEIGHT : STAND_HEIGHT;
            eyeHeight += (targetEyeHeight - eyeHeight) * Math.min(dt * 12, 1);

            if (controls.isLocked) {
                const forwardInput = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0);
                const strafeInput = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);

                const sprinting = !crouching && (keys.has('ShiftLeft') || keys.has('ShiftRight')) && forwardInput > 0;
                let targetSpeed = crouching ? CROUCH_SPEED : (sprinting ? RUN_SPEED : WALK_SPEED);

                camera.getWorldDirection(_forwardDir);
                _forwardDir.y = 0;
                if (_forwardDir.lengthSq() < 1e-6) _forwardDir.set(0, 0, -1);
                _forwardDir.normalize();

                _rightDir.set(-_forwardDir.z, 0, _forwardDir.x);

                _moveVec.set(0, 0, 0);
                _moveVec.addScaledVector(_forwardDir, forwardInput);
                _moveVec.addScaledVector(_rightDir, strafeInput);
                if (_moveVec.lengthSq() > 0) _moveVec.normalize().multiplyScalar(targetSpeed);

                const diff = _moveVec.clone().sub(velocity);
                const diffLen = diff.length();
                if (diffLen > 0.001) {
                    const accel = _moveVec.lengthSq() > 0 ? ACCEL : DECEL;
                    const step = Math.min(accel * dt, diffLen);
                    diff.multiplyScalar(step / diffLen);
                    velocity.add(diff);
                }

                const movedX = velocity.x * dt;
                const movedZ = velocity.z * dt;

                const curX = cameraRig.position.x;
                const curZ = cameraRig.position.z;

                const newX = curX + movedX;
                if (!isInsideWall(newX + Math.sign(movedX) * PLAYER_RADIUS, curZ, PLAYER_RADIUS)) cameraRig.position.x = newX;
                else velocity.x = 0;

                const newZ = curZ + movedZ;
                if (!isInsideWall(cameraRig.position.x, newZ + Math.sign(movedZ) * PLAYER_RADIUS, PLAYER_RADIUS)) cameraRig.position.z = newZ;
                else velocity.z = 0;

                const strafeVel = velocity.dot(_rightDir);
                const targetRoll = -THREE.MathUtils.clamp(strafeVel / RUN_SPEED, -1, 1) * MAX_ROLL;
                currentRoll += (targetRoll - currentRoll) * Math.min(ROLL_SPEED * dt, 1);
                cameraRig.rotation.z = currentRoll;

                const horizSpeed = Math.hypot(velocity.x, velocity.z);
                let bobY = 0;
                if (horizSpeed > 0.3) {
                    const freq = crouching ? 4.0 : (sprinting ? BOB_FREQ_RUN : BOB_FREQ_WALK);
                    const bobAmp = crouching ? BOB_AMP * 0.5 : BOB_AMP;
                    const speedFactor = Math.min(horizSpeed / targetSpeed, 1.2);
                    bobTime += dt * freq * speedFactor;
                    bobY = Math.sin(bobTime) * bobAmp * (sprinting ? 1.3 : 1.0);
                } else {
                    bobTime = 0;
                }
                cameraRig.position.y += (eyeHeight + bobY - cameraRig.position.y) * Math.min(dt * 20, 1);

                strideDistance += Math.hypot(movedX, movedZ);
                let strideLen = crouching ? STRIDE_LENGTH_CROUCH : (sprinting ? STRIDE_LENGTH_RUN : STRIDE_LENGTH_WALK);
                if (strideDistance >= strideLen && !currentFootstepSrc) {
                    playFootstep(sprinting, crouching);
                    strideDistance = 0;
                }
                if (horizSpeed < 0.2) strideDistance = Math.min(strideDistance, strideLen * 0.5);

            } else {
                velocity.set(0, 0, 0);
                currentRoll += (0 - currentRoll) * Math.min(dt * 6, 1);
                cameraRig.rotation.z = currentRoll;
                cameraRig.position.y += (eyeHeight - cameraRig.position.y) * Math.min(dt * 6, 1);
                strideDistance = 0;
            }

            // FLASHLIGHT SWAY
            if (controls.isLocked) {
                const currentCamQuat = new THREE.Quaternion();
                camera.getWorldQuaternion(currentCamQuat);
                targetHolderQuat.slerp(currentCamQuat, Math.min(dt * 10.0, 1.0));

                const parentQuat = new THREE.Quaternion();
                camera.getWorldQuaternion(parentQuat);
                const localQuat = targetHolderQuat.clone().multiply(parentQuat.clone().invert());
                
                flashlightHolder.quaternion.copy(localQuat);
            }

            flashlight.intensity += (flashlightTargetIntensity - flashlight.intensity) * Math.min(dt * 18, 1);

            // DUST
            dustMat.uniforms.uTime.value = elapsed;
            const camWorldPos = new THREE.Vector3();
            camera.getWorldPosition(camWorldPos);
            dustMat.uniforms.uCamPos.value.copy(camWorldPos);

            const flWorldPos = new THREE.Vector3();
            const flWorldDir = new THREE.Vector3();
            flashlight.getWorldPosition(flWorldPos);
            flashlight.getWorldDirection(flWorldDir);
            dustMat.uniforms.uFlashlightPos.value.copy(flWorldPos);
            dustMat.uniforms.uFlashlightDir.value.copy(flWorldDir);

            // MOTION BLUR
            const camWorldQuat = new THREE.Quaternion();
            camera.getWorldQuaternion(camWorldQuat);

            const invQuat = prevCamWorldQuat.clone().invert();
            const worldDelta = new THREE.Vector3().subVectors(camWorldPos, prevCamWorldPos);
            const localDelta = worldDelta.applyQuaternion(invQuat);

            const pixelVelX = -localDelta.x * 500.0;
            const pixelVelY = localDelta.y * 500.0;

            const quatDelta = prevCamWorldQuat.clone().invert().multiply(camWorldQuat);
            const euler = new THREE.Euler().setFromQuaternion(quatDelta, 'YXZ');
            const yawPixels = euler.y * 1600;
            const pitchPixels = euler.x * 1600;

            screenVelocity.set(pixelVelX + yawPixels, pixelVelY - pitchPixels);
            const targetBlur = Math.min(screenVelocity.length() / 35.0, 1.0);
            blurStrength += (targetBlur - blurStrength) * Math.min(dt * 14, 1);

            motionBlurPass.uniforms.uVelocity.value.copy(screenVelocity).multiplyScalar(0.35);
            motionBlurPass.uniforms.uStrength.value = blurStrength * 1.5;

            prevCamWorldPos.copy(camWorldPos);
            prevCamWorldQuat.copy(camWorldQuat);

            composer.render();
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            motionBlurPass.uniforms.uResolution.value.set(window.innerWidth * renderer.getPixelRatio(), window.innerHeight * renderer.getPixelRatio());
            dustMat.uniforms.uPixelRatio.value = renderer.getPixelRatio();
        });
    </script>
</body>
</html>
