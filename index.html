<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze — The Hunt</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #000; color: white; }
        #overlay {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: radial-gradient(circle at center, rgba(0,0,0,0.5), rgba(0,0,0,0.95));
            cursor: pointer; z-index: 200;
            transition: opacity 0.3s ease; text-align: center; padding: 20px; user-select: none;
        }
        #overlay.hidden { opacity: 0; pointer-events: none; }
        #overlay h1 { font-size: 56px; margin: 0 0 12px; letter-spacing: 10px; font-weight: 200; text-shadow: 0 0 20px rgba(255,0,0,0.5); }
        #overlay p { font-size: 15px; opacity: 0.8; margin: 6px 0; }
        .kbd {
            display: inline-block; padding: 2px 8px; margin: 0 2px;
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
            border-radius: 4px; font-size: 13px; font-family: monospace;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 4px; height: 4px; margin: -2px 0 0 -2px;
            border-radius: 50%; background: rgba(255,255,255,0.9);
            pointer-events: none; z-index: 150; display: none;
            box-shadow: 0 0 4px rgba(0,0,0,0.8);
        }
        #crosshair.visible { display: block; }
        #hud {
            position: absolute; bottom: 20px; left: 20px;
            font-size: 14px; font-family: monospace;
            display: none; text-shadow: 0 2px 4px #000;
            line-height: 1.6; letter-spacing: 1px;
        }
        #hud.visible { display: block; }
        #hud .key { color: #ffd700; font-weight: bold; }
        #hud .exit { color: #00ff88; font-weight: bold; }
        #flashlightIndicator {
            position: absolute; bottom: 20px; right: 20px;
            font-size: 13px; font-family: monospace; letter-spacing: 1px;
            display: none; text-shadow: 0 2px 4px #000;
        }
        #flashlightIndicator.visible { display: block; }
        #flashlightIndicator.on { color: #fff6a8; }
        #blinkOverlay {
            position: absolute; inset: 0; background-color: #000;
            opacity: 0; pointer-events: none; z-index: 500;
            transition: opacity 0.05s linear;
        }
        #vignette {
            position: absolute; inset: 0; pointer-events: none; z-index: 140;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
            transition: box-shadow 0.5s ease;
        }
        #vignette.hunting {
            box-shadow: inset 0 0 150px rgba(255,0,0,0.4);
        }
        #interactionPrompt {
            position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%);
            font-size: 18px; font-family: monospace; color: #fff;
            background: rgba(0,0,0,0.8); padding: 8px 16px; border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.3); pointer-events: none; z-index: 160;
            display: none; text-shadow: 0 2px 4px #000;
        }
        #interactionPrompt.visible { display: block; }
        #loading {
            position: absolute; inset: 0; display: flex;
            align-items: center; justify-content: center;
            background: #0a0a0a; color: #fff; z-index: 300;
            font-size: 14px; letter-spacing: 8px; transition: opacity 0.6s ease;
        }
        #loading.hidden { opacity: 0; pointer-events: none; }
        #errorMsg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #ff8888; background: rgba(0,0,0,0.9); padding: 20px 32px;
            border-radius: 8px; font-size: 14px; z-index: 400; display: none;
            text-align: center; max-width: 600px; line-height: 1.6;
            font-family: monospace; white-space: pre-wrap;
        }
        #errorMsg.visible { display: block; }
        #winScreen {
            position: absolute; inset: 0; display: none; flex-direction: column;
            align-items: center; justify-content: center;
            background: #000; color: #fff; z-index: 600;
        }
        #winScreen h1 { color: #00ff88; font-size: 48px; letter-spacing: 10px; }
    </style>
</head>
<body>
    <div id="loading">LOADING</div>
    <div id="overlay" style="display:none">
        <h1>THE HUNT</h1>
        <p>Find <span style="color:#ffd700">3 KEYS</span> and escape through the <span style="color:#00ff88">EXIT</span></p>
        <p style="margin-top:20px"><span class="kbd">W</span><span class="kbd">A</span><span class="kbd">S</span><span class="kbd">D</span> Move · <span class="kbd">C</span> Crouch · <span class="kbd">Q</span> Blink · <span class="kbd">F</span> Flashlight</p>
        <p style="margin-top:30px; color:#ff4444; font-size:12px;">He is listening.</p>
        <p style="margin-top:16px;opacity:0.5">Click anywhere to begin</p>
    </div>
    
    <div id="crosshair"></div>
    <div id="hud">
        KEYS: <span class="key" id="keyCount">0</span> / 3<br>
        <span id="exitStatus"></span>
    </div>
    <div id="flashlightIndicator">FLASHLIGHT: OFF</div>
    <div id="interactionPrompt"></div>
    <div id="vignette"></div>
    <div id="blinkOverlay"></div>
    <div id="winScreen"><h1>YOU ESCAPED</h1></div>
    <div id="errorMsg"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        window.addEventListener('error', (e) => {
            const err = document.getElementById('errorMsg');
            const load = document.getElementById('loading');
            if (err && load) {
                load.classList.add('hidden');
                err.textContent = 'Error: ' + (e.message || e.error || 'unknown') + '\n\n' + (e.filename || '') + ':' + (e.lineno || '');
                err.classList.add('visible');
            }
        });

        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // ============================================================
        // CONSTANTS
        // ============================================================
        const MAZE_W = 21;
        const MAZE_H = 21;
        const CELL_SIZE = 5.0;
        const WALL_THICK = 0.4;
        const WALL_HEIGHT = 3.5;

        const STAND_HEIGHT = 1.7;
        const CROUCH_HEIGHT = 1.0;
        let eyeHeight = STAND_HEIGHT;

        const halfW = (MAZE_W - 1) / 2;
        const halfH = (MAZE_H - 1) / 2;
        const cellWorldX = (cx) => (cx - halfW) * CELL_SIZE;
        const cellWorldZ = (cz) => (cz - halfH) * CELL_SIZE;

        // ============ RENDERER ============
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.6;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        // ============ SCENE ============
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.FogExp2(0x050505, 0.035);

        // ============ CAMERA RIG ============
        const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.05, 300);
        camera.position.set(0, 0, 0);

        const cameraRig = new THREE.Object3D();
        cameraRig.add(camera);
        scene.add(cameraRig);

        // ============ LIGHTING ============
        const hemi = new THREE.HemisphereLight(0x4a5a6a, 0x1a1510, 0.5);
        scene.add(hemi);

        // ============ FLASHLIGHT ============
        const flashlightHolder = new THREE.Object3D();
        camera.add(flashlightHolder);

        const flashlight = new THREE.SpotLight(0xfff2cc, 0, 80, Math.PI / 6, 0.4, 1.0);
        flashlight.position.set(0.15, -0.15, 0.1);
        flashlight.target.position.set(0, 0, -10);
        flashlight.distance = 100;
        flashlight.decay = 0.8; 
        
        flashlightHolder.add(flashlight);
        flashlightHolder.add(flashlight.target);

        let flashlightOn = false;
        let flashlightTargetIntensity = 0;

        const lastCameraQuat = new THREE.Quaternion();
        const targetHolderQuat = new THREE.Quaternion();

        // ============ MAZE GRID ============
        const wallsH = [];
        const wallsV = [];
        for (let z = 0; z <= MAZE_H; z++) wallsH.push(new Array(MAZE_W).fill(true));
        for (let z = 0; z < MAZE_H; z++) wallsV.push(new Array(MAZE_W + 1).fill(true));

        function generateMaze() {
            const visited = [];
            for (let z = 0; z < MAZE_H; z++) visited.push(new Array(MAZE_W).fill(false));
            visited[0][0] = true;

            function carve(x, z) {
                const dirs = [
                    { dx: 0, dz: -1, wall: 'N' }, { dx: 1, dz: 0, wall: 'E' },
                    { dx: 0, dz: 1, wall: 'S' }, { dx: -1, dz: 0, wall: 'W' }
                ];
                for (let i = dirs.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
                }
                for (const d of dirs) {
                    const nx = x + d.dx;
                    const nz = z + d.dz;
                    if (nx < 0 || nx >= MAZE_W || nz < 0 || nz >= MAZE_H) continue;
                    if (visited[nz][nx]) continue;
                    visited[nz][nx] = true;

                    if (d.wall === 'N') wallsH[z][x] = false;
                    if (d.wall === 'S') wallsH[z + 1][x] = false;
                    if (d.wall === 'W') wallsV[z][x] = false;
                    if (d.wall === 'E') wallsV[z][x + 1] = false;

                    carve(nx, nz);
                }
            }
            carve(0, 0);
        }
        generateMaze();

        // Clear a bit of space in the center for a room
        for(let z = 9; z < 12; z++) {
            for(let x = 9; x < 12; x++) {
                if(z < MAZE_H && wallsH[z] && wallsH[z][x]) wallsH[z][x] = false;
                if(z + 1 <= MAZE_H && wallsH[z+1] && wallsH[z+1][x]) wallsH[z+1][x] = false;
                if(x < MAZE_W && wallsV[z] && wallsV[z][x]) wallsV[z][x] = false;
                if(x + 1 <= MAZE_W && wallsV[z] && wallsV[z][x+1]) wallsV[z][x+1] = false;
            }
        }

        // ============ WALL TEXTURES ============
        function makeWallTextures() {
            const S = 512;
            const c = document.createElement('canvas');
            c.width = c.height = S;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#6e6a63';
            ctx.fillRect(0, 0, S, S);
            const img = ctx.getImageData(0, 0, S, S);
            const d = img.data;
            for (let i = 0; i < d.length; i += 4) {
                const n = (Math.random() - 0.5) * 45;
                d[i] = Math.max(0, Math.min(255, d[i] + n));
                d[i+1] = Math.max(0, Math.min(255, d[i+1] + n));
                d[i+2] = Math.max(0, Math.min(255, d[i+2] + n));
            }
            ctx.putImageData(img, 0, 0);

            ctx.strokeStyle = 'rgba(30,28,25,0.55)';
            ctx.lineWidth = 3;
            const courseH = S / 8;
            for (let i = 0; i <= 8; i++) {
                ctx.beginPath(); ctx.moveTo(0, i * courseH); ctx.lineTo(S, i * courseH); ctx.stroke();
            }
            ctx.strokeStyle = 'rgba(35,32,28,0.4)';
            ctx.lineWidth = 2;
            const brickW = S / 6;
            for (let row = 0; row < 8; row++) {
                const y = row * courseH;
                const offset = (row % 2) * (brickW / 2);
                for (let i = 0; i < 6; i++) {
                    const x = i * brickW + offset;
                    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + courseH); ctx.stroke();
                }
            }

            const grimeGrad = ctx.createLinearGradient(0, S, 0, S/2);
            grimeGrad.addColorStop(0, 'rgba(20,30,20,0.4)');
            grimeGrad.addColorStop(1, 'rgba(20,30,20,0)');
            ctx.fillStyle = grimeGrad;
            ctx.fillRect(0, 0, S, S);

            for (let i = 0; i < 80; i++) {
                const x = Math.random() * S;
                const y = Math.random() * S;
                const r = 10 + Math.random() * 60;
                const g = ctx.createRadialGradient(x, y, 0, x, y, r);
                g.addColorStop(0, `rgba(0,0,0,${0.05 + Math.random() * 0.08})`);
                g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = g;
                ctx.fillRect(x - r, y - r, r * 2, r * 2);
            }

            const colorTex = new THREE.CanvasTexture(c);
            colorTex.wrapS = colorTex.wrapT = THREE.RepeatWrapping;
            colorTex.repeat.set(1, 1);
            colorTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
            colorTex.colorSpace = THREE.SRGBColorSpace;

            const nCanvas = document.createElement('canvas');
            nCanvas.width = nCanvas.height = 512;
            const nctx = nCanvas.getContext('2d');
            nctx.fillStyle = '#8080ff';
            nctx.fillRect(0, 0, 512, 512);
            nctx.strokeStyle = 'rgba(90,90,255,1)';
            nctx.lineWidth = 4;
            for (let i = 0; i <= 8; i++) {
                nctx.beginPath(); nctx.moveTo(0, i * (512/8)); nctx.lineTo(512, i * (512/8)); nctx.stroke();
            }
            nctx.strokeStyle = 'rgba(110,110,255,1)';
            nctx.lineWidth = 3;
            for (let row = 0; row < 8; row++) {
                const y = row * (512 / 8);
                const offset = (row % 2) * (512 / 12);
                for (let i = 0; i < 6; i++) {
                    const x = i * (512 / 6) + offset;
                    nctx.beginPath(); nctx.moveTo(x, y); nctx.lineTo(x, y + 512 / 8); nctx.stroke();
                }
            }
            const normalTex = new THREE.CanvasTexture(nCanvas);
            normalTex.wrapS = normalTex.wrapT = THREE.RepeatWrapping;
            normalTex.repeat.set(1, 1);
            return { colorTex, normalTex };
        }

        const wallTextures = makeWallTextures();
        const wallMat = new THREE.MeshStandardMaterial({
            map: wallTextures.colorTex,
            normalMap: wallTextures.normalTex,
            normalScale: new THREE.Vector2(1.2, 1.2),
            color: 0x9a948a,
            roughness: 0.92,
            metalness: 0.03,
        });

        // ============ MAZE WALLS ============
        const wallTransforms = [];
        for (let z = 0; z <= MAZE_H; z++) {
            for (let x = 0; x < MAZE_W; x++) {
                if (!wallsH[z][x]) continue;
                const wx = cellWorldX(x);
                const wz = z === 0 ? cellWorldZ(0) - CELL_SIZE / 2
                         : z === MAZE_H ? cellWorldZ(MAZE_H - 1) + CELL_SIZE / 2
                         : cellWorldZ(z - 1) + CELL_SIZE / 2;
                wallTransforms.push({ x: wx, y: WALL_HEIGHT / 2, z: wz, sx: CELL_SIZE + WALL_THICK, sy: WALL_HEIGHT, sz: WALL_THICK });
            }
        }
        for (let z = 0; z < MAZE_H; z++) {
            for (let x = 0; x <= MAZE_W; x++) {
                if (!wallsV[z][x]) continue;
                const wx = x === 0 ? cellWorldX(0) - CELL_SIZE / 2
                         : x === MAZE_W ? cellWorldX(MAZE_W - 1) + CELL_SIZE / 2
                         : cellWorldX(x - 1) + CELL_SIZE / 2;
                const wz = cellWorldZ(z);
                wallTransforms.push({ x: wx, y: WALL_HEIGHT / 2, z: wz, sx: WALL_THICK, sy: WALL_HEIGHT, sz: CELL_SIZE + WALL_THICK });
            }
        }

        const wallGeo = new THREE.BoxGeometry(1, 1, 1);
        const instancedWalls = new THREE.InstancedMesh(wallGeo, wallMat, wallTransforms.length);
        instancedWalls.castShadow = true;
        instancedWalls.receiveShadow = true;

        const _m = new THREE.Matrix4();
        const _p = new THREE.Vector3();
        const _q = new THREE.Quaternion();
        const _s = new THREE.Vector3();
        for (let i = 0; i < wallTransforms.length; i++) {
            const t = wallTransforms[i];
            _p.set(t.x, t.y, t.z);
            _s.set(t.sx, t.sy, t.sz);
            _m.compose(_p, _q, _s);
            instancedWalls.setMatrixAt(i, _m);
        }
        instancedWalls.instanceMatrix.needsUpdate = true;
        scene.add(instancedWalls);

        // ============ CEILING & FLOOR ============
        // Detailed Ceiling
        function makeCeilingTexture() {
            const S = 512;
            const c = document.createElement('canvas');
            c.width = c.height = S;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#4a4844';
            ctx.fillRect(0, 0, S, S);
            const img = ctx.getImageData(0, 0, S, S);
            const d = img.data;
            for (let i = 0; i < d.length; i += 4) {
                const n = (Math.random() - 0.5) * 30;
                d[i] = Math.max(0, Math.min(255, d[i] + n));
                d[i+1] = Math.max(0, Math.min(255, d[i+1] + n));
                d[i+2] = Math.max(0, Math.min(255, d[i+2] + n));
            }
            ctx.putImageData(img, 0, 0);
            ctx.strokeStyle = 'rgba(20,18,15,0.5)';
            ctx.lineWidth = 4;
            for (let i = 0; i <= 4; i++) {
                const p = i * (S / 4);
                ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, S); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(S, p); ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set((MAZE_W * CELL_SIZE) / 5, (MAZE_H * CELL_SIZE) / 5);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        const ceilingGeo = new THREE.PlaneGeometry(MAZE_W * CELL_SIZE + 4, MAZE_H * CELL_SIZE + 4);
        const ceiling = new THREE.Mesh(ceilingGeo, new THREE.MeshStandardMaterial({ 
            map: makeCeilingTexture(), color: 0x5a5753, roughness: 0.95, metalness: 0.02, side: THREE.DoubleSide 
        }));
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = WALL_HEIGHT + 0.05;
        ceiling.receiveShadow = true;
        scene.add(ceiling);

        // Ceiling Pipes
        const pipeMat = new THREE.MeshStandardMaterial({ color: 0x4a3b2e, roughness: 0.7, metalness: 0.6 });
        const pipeGeo = new THREE.CylinderGeometry(0.08, 0.08, 100, 8);
        pipeGeo.rotateZ(Math.PI / 2);
        for (let i = 0; i < 4; i++) {
            const pipe = new THREE.Mesh(pipeGeo, pipeMat);
            pipe.position.set(0, WALL_HEIGHT - 0.2, -30 + i * 20);
            pipe.rotation.y = Math.PI / 2;
            scene.add(pipe);
        }

        // Detailed Floor
        function makeGroundTexture() {
            const S = 1024;
            const c = document.createElement('canvas');
            c.width = c.height = S;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#5a5a5a';
            ctx.fillRect(0, 0, S, S);
            const img = ctx.getImageData(0, 0, S, S);
            const d = img.data;
            for (let i = 0; i < d.length; i += 4) {
                const n = (Math.random() - 0.5) * 40;
                d[i] = Math.max(0, Math.min(255, d[i] + n));
                d[i+1] = Math.max(0, Math.min(255, d[i+1] + n));
                d[i+2] = Math.max(0, Math.min(255, d[i+2] + n));
            }
            ctx.putImageData(img, 0, 0);
            ctx.strokeStyle = 'rgba(30,30,30,0.8)';
            ctx.lineWidth = 4;
            const step = S / 8;
            for (let i = 0; i <= 8; i++) {
                ctx.beginPath(); ctx.moveTo(i*step, 0); ctx.lineTo(i*step, S); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i*step); ctx.lineTo(S, i*step); ctx.stroke();
            }
            for (let i = 0; i < 200; i++) {
                const x = Math.random() * S, y = Math.random() * S;
                const r = 20 + Math.random() * 80;
                const g = ctx.createRadialGradient(x, y, 0, x, y, r);
                g.addColorStop(0, `rgba(10,10,10,${0.05 + Math.random() * 0.1})`);
                g.addColorStop(1, 'rgba(10,10,10,0)');
                ctx.fillStyle = g;
                ctx.fillRect(x - r, y - r, r * 2, r * 2);
            }
            const colorTex = new THREE.CanvasTexture(c);
            colorTex.wrapS = colorTex.wrapT = THREE.RepeatWrapping;
            colorTex.repeat.set(20, 20);
            colorTex.colorSpace = THREE.SRGBColorSpace;
            return colorTex;
        }

        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({ 
            map: makeGroundTexture(), color: 0x808080, roughness: 1.0 
        }));
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // ============ DOORS & ROOMS ============
        const doors = [];
        const doorMat = new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 0.8, metalness: 0.2 });
        const doorGeo = new THREE.BoxGeometry(2.0, 2.8, 0.15);

        for(let i=0; i<6; i++) {
            const cx = Math.floor(Math.random() * MAZE_W);
            const cz = Math.floor(Math.random() * MAZE_H);
            
            // Ensure not on outer walls
            if(cx === 0 || cx === MAZE_W-1 || cz === 0 || cz === MAZE_H-1) continue;

            const isHoriz = Math.random() > 0.5;
            
            if(isHoriz && wallsH[cz][cx]) {
                wallsH[cz][cx] = false; // remove wall for door
                const door = new THREE.Mesh(doorGeo, doorMat);
                door.position.set(cellWorldX(cx), 1.4, cellWorldZ(cz-1) + CELL_SIZE/2);
                door.rotation.y = Math.PI/2;
                scene.add(door);
                doors.push({ mesh: door, baseRot: Math.PI/2, openRot: Math.PI, open: false });
            } else if (!isHoriz && wallsV[cz][cx]) {
                wallsV[cz][cx] = false;
                const door = new THREE.Mesh(doorGeo, doorMat);
                door.position.set(cellWorldX(cx-1) + CELL_SIZE/2, 1.4, cellWorldZ(cz));
                door.rotation.y = 0;
                scene.add(door);
                doors.push({ mesh: door, baseRot: 0, openRot: -Math.PI/2, open: false });
            }
        }

        // ============ ITEMS (KEYS & EXIT) ============
        const items = [];
        const keyMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffaa00, emissiveIntensity: 2 });
        const keyGeo = new THREE.BoxGeometry(0.15, 0.4, 0.1);

        for(let i=0; i<3; i++) {
            const cx = Math.floor(Math.random() * MAZE_W);
            const cz = Math.floor(Math.random() * MAZE_H);
            const key = new THREE.Mesh(keyGeo, keyMat);
            key.position.set(cellWorldX(cx), 1.0, cellWorldZ(cz));
            key.castShadow = true;
            
            const light = new THREE.PointLight(0xffaa00, 1, 3);
            key.add(light);
            
            scene.add(key);
            items.push({ type: 'key', mesh: key, collected: false });
        }

        const exitMat = new THREE.MeshStandardMaterial({ color: 0x00ff88, emissive: 0x00ff88, emissiveIntensity: 1 });
        const exitDoor = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 0.3), exitMat);
        exitDoor.position.set(cellWorldX(MAZE_W-1), 1.5, cellWorldZ(MAZE_H-1));
        scene.add(exitDoor);

        // ============ THE MONSTER ============
        const monsterGroup = new THREE.Group();
        
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 1.0 });
        const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.5, 1.5, 4, 8), bodyMat);
        body.position.y = 1.2;
        monsterGroup.add(body);

        const headMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 0.6), headMat);
        head.position.y = 2.2;
        monsterGroup.add(head);

        const eyeMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 5.0 });
        const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), eyeMat);
        eyeL.position.set(-0.15, 2.2, -0.3);
        monsterGroup.add(eyeL);
        const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), eyeMat);
        eyeR.position.set(0.15, 2.2, -0.3);
        monsterGroup.add(eyeR);

        const headLight = new THREE.SpotLight(0xff0000, 5, 20, Math.PI / 4, 0.5, 1);
        headLight.position.set(0, 2.2, -0.3);
        headLight.target.position.set(0, 2.2, -10);
        monsterGroup.add(headLight);
        monsterGroup.add(headLight.target);

        // Start the monster far from the player
        monsterGroup.position.set(cellWorldX(MAZE_W-2), 0, cellWorldZ(MAZE_H-2));
        scene.add(monsterGroup);

        // ============ DUST PARTICLES ============
        const DUST_COUNT = 4000;
        const dustGeo = new THREE.BufferGeometry();
        const dustPositions = new Float32Array(DUST_COUNT * 3);
        const dustSizes = new Float32Array(DUST_COUNT);
        const dustPhases = new Float32Array(DUST_COUNT);
        const dustSpeeds = new Float32Array(DUST_COUNT);

        const DUST_RANGE_XZ = 25;
        const DUST_RANGE_Y = 3.0;

        for (let i = 0; i < DUST_COUNT; i++) {
            const yBias = Math.pow(Math.random(), 2.0);
            dustPositions[i * 3]     = (Math.random() - 0.5) * DUST_RANGE_XZ * 2;
            dustPositions[i * 3 + 1] = yBias * DUST_RANGE_Y + 0.1;
            dustPositions[i * 3 + 2] = (Math.random() - 0.5) * DUST_RANGE_XZ * 2;
            dustSizes[i] = 0.02 + Math.random() * 0.08;
            dustPhases[i] = Math.random() * Math.PI * 2;
            dustSpeeds[i] = 0.15 + Math.random() * 0.5;
        }

        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
        dustGeo.setAttribute('aSize', new THREE.BufferAttribute(dustSizes, 1));
        dustGeo.setAttribute('aPhase', new THREE.BufferAttribute(dustPhases, 1));
        dustGeo.setAttribute('aSpeed', new THREE.BufferAttribute(dustSpeeds, 1));

        const dustMat = new THREE.ShaderMaterial({
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            uniforms: {
                uTime: { value: 0 },
                uCamPos: { value: new THREE.Vector3() },
                uPixelRatio: { value: renderer.getPixelRatio() },
                uFlashlightPos: { value: new THREE.Vector3() },
                uFlashlightDir: { value: new THREE.Vector3(0, 0, -1) },
                uFlashlightOn: { value: 0 }
            },
            vertexShader: `
                attribute float aSize;
                attribute float aPhase;
                attribute float aSpeed;
                uniform float uTime;
                uniform vec3 uCamPos;
                uniform float uPixelRatio;
                uniform vec3 uFlashlightPos;
                uniform vec3 uFlashlightDir;
                uniform float uFlashlightOn;
                varying float vAlpha;
                varying float vFlashlit;

                void main() {
                    vec3 pos = position;
                    float t = uTime * aSpeed;

                    pos.x += sin(t * 0.8 + aPhase) * 0.6 + cos(t * 1.5 + aPhase * 0.3) * 0.2;
                    pos.z += cos(t * 0.9 + aPhase * 1.2) * 0.6 + sin(t * 1.2 + aPhase * 1.4) * 0.2;
                    pos.y += sin(t * 0.5 + aPhase * 2.1) * 0.3;

                    vec3 camGrid = floor(uCamPos / 25.0) * 25.0;
                    vec3 toCam = pos - camGrid;
                    
                    float wrapR = 25.0;
                    toCam.x = mod(toCam.x + wrapR, wrapR * 2.0) - wrapR;
                    toCam.z = mod(toCam.z + wrapR, wrapR * 2.0) - wrapR;
                    
                    vec3 worldPos = camGrid + toCam;
                    worldPos.y = mod(pos.y, 3.0) + 0.1;

                    float twinkle = 0.7 + 0.3 * sin(t * 2.0 + aPhase * 5.0);

                    vec3 toParticle = normalize(worldPos - uFlashlightPos);
                    float cosAngle = dot(toParticle, normalize(uFlashlightDir));
                    float inCone = smoothstep(0.88, 1.0, cosAngle);
                    float distF = smoothstep(25.0, 2.0, length(worldPos - uFlashlightPos));
                    vFlashlit = uFlashlightOn * inCone * distF;

                    vec4 mvPosition = viewMatrix * vec4(worldPos, 1.0);
                    gl_Position = projectionMatrix * mvPosition;

                    float dist = length(mvPosition.xyz);
                    gl_PointSize = aSize * uPixelRatio * (400.0 / max(dist, 0.5));
                    gl_PointSize = min(gl_PointSize, 24.0 * uPixelRatio);

                    vAlpha = smoothstep(40.0, 5.0, dist) * smoothstep(0.0, 1.0, dist) * twinkle;
                }`,
            fragmentShader: `
                varying float vAlpha;
                varying float vFlashlit;

                void main() {
                    vec2 c = gl_PointCoord - 0.5;
                    float d = length(c);
                    if (d > 0.5) discard;

                    float core = smoothstep(0.5, 0.1, d);
                    float a = core * 0.6;

                    vec3 color = vec3(1.0, 0.95, 0.85);
                    color += vec3(0.8, 0.7, 0.5) * vFlashlit * 3.0;
                    a *= 1.0 + vFlashlit * 4.0;

                    gl_FragColor = vec4(color, a * vAlpha);
                }`
        });

        const dustPoints = new THREE.Points(dustGeo, dustMat);
        dustPoints.frustumCulled = false;
        scene.add(dustPoints);

        // ============ AUDIO SYSTEM ============
        let audioCtx = null;
        let masterGain = null;
        let playerFootstepBuffer = null;
        let monsterFootstepBuffer = null;
        let playerSrc = null;
        let monsterSrc = null;
        let monsterPanner = null;

        async function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 1.0;
            masterGain.connect(audioCtx.destination);

            const sr = audioCtx.sampleRate;

            // Player Footstep (soft)
            playerFootstepBuffer = audioCtx.createBuffer(1, sr * 0.2, sr);
            const pData = playerFootstepBuffer.getChannelData(0);
            for (let i = 0; i < pData.length; i++) {
                const t = i / sr;
                pData[i] = (Math.random()*2-1) * Math.exp(-t*30) * (1 - Math.exp(-t*200)) * 0.3;
            }

            // Monster Footstep (heavy, low, loud)
            monsterFootstepBuffer = audioCtx.createBuffer(1, sr * 0.5, sr);
            const mData = monsterFootstepBuffer.getChannelData(0);
            for (let i = 0; i < mData.length; i++) {
                const t = i / sr;
                const thump = Math.sin(2*Math.PI*40*t) * Math.exp(-t*8);
                const noise = (Math.random()*2-1) * Math.exp(-t*15);
                mData[i] = (thump * 0.8 + noise * 0.2) * (1 - Math.exp(-t*100));
            }
            
            // Setup 3D Panner for Monster
            monsterPanner = audioCtx.createPanner();
            monsterPanner.panningModel = 'HRTF';
            monsterPanner.distanceModel = 'inverse';
            monsterPanner.refDistance = 2;
            monsterPanner.maxDistance = 50;
            monsterPanner.rolloffFactor = 1.5;
            monsterPanner.connect(masterGain);
        }

        function playSound(buffer, isMonster) {
            if (!audioCtx) return;
            const src = audioCtx.createBufferSource();
            src.buffer = buffer;
            
            if (isMonster) {
                if (monsterSrc) try{ monsterSrc.stop(); }catch(e){}
                src.connect(monsterPanner);
                monsterSrc = src;
            } else {
                if (playerSrc) try{ playerSrc.stop(); }catch(e){}
                const gain = audioCtx.createGain();
                gain.gain.value = 0.5;
                src.connect(gain);
                gain.connect(masterGain);
                playerSrc = src;
            }
            src.start();
        }

        // ============ POST-PROCESSING ============
        const composer = new EffectComposer(renderer);
        composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        composer.addPass(new RenderPass(scene, camera));
        const motionBlurPass = new ShaderPass({
            uniforms: { tDiffuse: { value: null }, uStrength: { value: 0.0 } },
            vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
            fragmentShader: `
                uniform sampler2D tDiffuse; uniform float uStrength; varying vec2 vUv;
                void main() {
                    if(uStrength < 0.01) { gl_FragColor = texture2D(tDiffuse, vUv); return; }
                    vec4 sum = vec4(0.0);
                    for(int i=0; i<8; i++) {
                        float t = (float(i)/7.0 - 0.5) * uStrength * 0.1;
                        sum += texture2D(tDiffuse, vUv + vec2(t, t*0.5));
                    }
                    gl_FragColor = sum / 8.0;
                }`
        });
        composer.addPass(motionBlurPass);
        composer.addPass(new OutputPass());

        // ============ INPUT & STATE ============
        const controls = new PointerLockControls(camera, renderer.domElement);
        const overlay = document.getElementById('overlay');
        const hud = document.getElementById('hud');
        const keyHud = document.getElementById('keyCount');
        const exitHud = document.getElementById('exitStatus');
        const crosshair = document.getElementById('crosshair');
        const flIndicator = document.getElementById('flashlightIndicator');
        const prompt = document.getElementById('interactionPrompt');
        const blinkOverlay = document.getElementById('blinkOverlay');
        const vignette = document.getElementById('vignette');
        const winScreen = document.getElementById('winScreen');

        // KEYBOARD INPUT SET
        const keys = new Set();

        let eyesClosed = false, blinkAnim = 0;
        let keysCollected = 0;
        let gameWon = false;

        let monsterPos = new THREE.Vector3().copy(monsterGroup.position);
        let monsterState = 'patrol'; // patrol, chase
        let monsterPath = [];
        let monsterTarget = new THREE.Vector3();
        let monsterTimer = 0;

        document.addEventListener('keydown', (e) => {
            if (!controls.isLocked || gameWon) return;
            if (e.repeat) return;
            keys.add(e.code);
            if (e.code === 'KeyF') {
                flashlightOn = !flashlightOn;
                flashlightTargetIntensity = flashlightOn ? 22.0 : 0.0;
                flIndicator.textContent = flashlightOn ? 'FLASHLIGHT: ON' : 'FLASHLIGHT: OFF';
                flIndicator.classList.toggle('on', flashlightOn);
            }
            if (e.code === 'KeyQ') eyesClosed = true;
        });
        document.addEventListener('keyup', (e) => {
            keys.delete(e.code);
            if (e.code === 'KeyQ') eyesClosed = false;
        });
        window.addEventListener('blur', () => keys.clear());

        // Simple pathfinding helper
        function getNextMonsterCell(mx, mz, tx, tz) {
            // A* Lite (very basic Dijkstra) for the monster
            const queue = [{ x: mx, z: mz, path: [] }];
            const visited = new Set();
            visited.add(`${mx},${mz}`);
            
            while(queue.length > 0) {
                const curr = queue.shift();
                if (curr.x === tx && curr.z === tz) return curr.path;
                
                const dirs = [
                    { dx: 0, dz: -1, wall: 'N' }, { dx: 1, dz: 0, wall: 'E' },
                    { dx: 0, dz: 1, wall: 'S' }, { dx: -1, dz: 0, wall: 'W' }
                ];
                
                for (const d of dirs) {
                    const nx = curr.x + d.dx;
                    const nz = curr.z + d.dz;
                    if (nx < 0 || nx >= MAZE_W || nz < 0 || nz >= MAZE_H) continue;
                    
                    let canMove = true;
                    if (d.wall === 'N' && wallsH[curr.z][curr.x]) canMove = false;
                    if (d.wall === 'S' && wallsH[curr.z+1][curr.x]) canMove = false;
                    if (d.wall === 'W' && wallsV[curr.z][curr.x]) canMove = false;
                    if (d.wall === 'E' && wallsV[curr.z][curr.x+1]) canMove = false;

                    if (canMove && !visited.has(`${nx},${nz}`)) {
                        visited.add(`${nx},${nz}`);
                        queue.push({ x: nx, z: nz, path: [...curr.path, {x: nx, z: nz}] });
                    }
                }
            }
            return []; // No path
        }

        // ============ GAME LOOP ============
        const clock = new THREE.Clock();
        let elapsed = 0, strideDist = 0, bobTime = 0, currentRoll = 0;
        const velocity = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);
            elapsed += dt;

            if (gameWon) return;

            // BLINK
            blinkAnim += ((eyesClosed ? 1 : 0) - blinkAnim) * Math.min(dt * 15, 1);
            blinkOverlay.style.opacity = blinkAnim;

            // PLAYER MOVEMENT
            const crouching = controls.isLocked && keys.has('KeyC');
            eyeHeight += ((crouching ? CROUCH_HEIGHT : STAND_HEIGHT) - eyeHeight) * Math.min(dt * 12, 1);

            if (controls.isLocked) {
                const fwd = (keys.has('KeyW')?1:0) - (keys.has('KeyS')?1:0);
                const str = (keys.has('KeyD')?1:0) - (keys.has('KeyA')?1:0);
                const sprinting = !crouching && (keys.has('ShiftLeft') || keys.has('ShiftRight')) && fwd > 0;
                
                const targetSpeed = crouching ? 1.4 : (sprinting ? 7.0 : 3.2);
                
                const camDir = new THREE.Vector3();
                camera.getWorldDirection(camDir); camDir.y = 0; camDir.normalize();
                const camRight = new THREE.Vector3(-camDir.z, 0, camDir.x);

                const move = new THREE.Vector3();
                move.addScaledVector(camDir, fwd);
                move.addScaledVector(camRight, str);
                if (move.lengthSq() > 0) move.normalize().multiplyScalar(targetSpeed);

                velocity.lerp(move, Math.min(dt * 10, 1));
                
                const mX = velocity.x * dt;
                const mZ = velocity.z * dt;

                if (!isInsideWall(cameraRig.position.x + mX, cameraRig.position.z, 0.35)) cameraRig.position.x += mX;
                else velocity.x = 0;
                if (!isInsideWall(cameraRig.position.x, cameraRig.position.z + mZ, 0.35)) cameraRig.position.z += mZ;
                else velocity.z = 0;

                // Tilt & Bob
                currentRoll += (-(velocity.dot(camRight) / 7.0) * 0.08 - currentRoll) * Math.min(dt * 5, 1);
                cameraRig.rotation.z = currentRoll;

                const hSpeed = Math.hypot(velocity.x, velocity.z);
                if (hSpeed > 0.5) {
                    bobTime += dt * (sprinting ? 9 : 5.5);
                    strideDist += hSpeed * dt;
                }
                cameraRig.position.y += (eyeHeight + Math.sin(bobTime) * 0.045 - cameraRig.position.y) * Math.min(dt * 15, 1);

                // Player Footsteps
                if (strideDist > 1.1) {
                    playSound(playerFootstepBuffer, false);
                    strideDist = 0;
                }

                // Flashlight Sway
                const camQ = new THREE.Quaternion(); camera.getWorldQuaternion(camQ);
                targetHolderQuat.slerp(camQ, Math.min(dt * 8, 1));
                flashlightHolder.quaternion.copy(targetHolderQuat.clone().multiply(camQ.clone().invert()));

                // Check Items
                items.forEach(item => {
                    if (item.collected) return;
                    if (cameraRig.position.distanceTo(item.mesh.position) < 1.5) {
                        item.collected = true;
                        item.mesh.visible = false;
                        if (item.type === 'key') {
                            keysCollected++;
                            keyHud.textContent = keysCollected;
                        }
                    }
                });

                // Check Exit
                if (cameraRig.position.distanceTo(exitDoor.position) < 2.5) {
                    if (keysCollected >= 3) {
                        gameWon = true;
                        winScreen.style.display = 'flex';
                        controls.unlock();
                    } else {
                        exitHud.textContent = "LOCKED (" + keysCollected + "/3 Keys)";
                    }
                }

                // Doors
                doors.forEach(door => {
                    const dist = cameraRig.position.distanceTo(door.mesh.position);
                    if (dist < 3.0) {
                        door.mesh.rotation.y += (door.openRot - door.mesh.rotation.y) * Math.min(dt * 4, 1);
                    } else {
                        door.mesh.rotation.y += (door.baseRot - door.mesh.rotation.y) * Math.min(dt * 4, 1);
                    }
                });
            }

            // ============ MONSTER AI ============
            const mPos = monsterGroup.position;
            const pPos = cameraRig.position;
            const distToPlayer = mPos.distanceTo(pPos);

            // Line of sight check
            let canSeePlayer = false;
            if (distToPlayer < 25) {
                // Simplified LOS: if no walls, sees player.
                canSeePlayer = true; 
            }

            if (canSeePlayer) {
                monsterState = 'chase';
                vignette.classList.add('hunting');
            } else {
                monsterState = 'patrol';
                vignette.classList.remove('hunting');
            }

            if (monsterState === 'chase') {
                // Move directly towards player fast
                const dir = new THREE.Vector3().subVectors(pPos, mPos).normalize();
                monsterGroup.position.addScaledVector(dir, 8.0 * dt); // Very fast
                monsterGroup.lookAt(pPos.x, 1.5, pPos.z);
                
                // Rapid footsteps
                monsterTimer -= dt;
                if (monsterTimer <= 0) {
                    playSound(monsterFootstepBuffer, true);
                    monsterTimer = 0.35;
                }
                
                // Catch player
                if (distToPlayer < 1.5) {
                    alert("He caught you.");
                    window.location.reload();
                }
            } else {
                // Patrol randomly
                const mGridX = Math.round(mPos.x / CELL_SIZE + halfW);
                const mGridZ = Math.round(mPos.z / CELL_SIZE + halfH);
                
                if (monsterPath.length === 0) {
                    const tx = Math.floor(Math.random() * MAZE_W);
                    const tz = Math.floor(Math.random() * MAZE_H);
                    monsterPath = getNextMonsterCell(mGridX, mGridZ, tx, tz);
                }
                
                if (monsterPath.length > 0) {
                    const next = monsterPath[0];
                    const nPos = new THREE.Vector3(cellWorldX(next.x), 0, cellWorldZ(next.z));
                    const dir = new THREE.Vector3().subVectors(nPos, mPos).normalize();
                    monsterGroup.position.addScaledVector(dir, 2.5 * dt);
                    monsterGroup.lookAt(nPos.x, 1.5, nPos.z);
                    
                    if (mPos.distanceTo(nPos) < 0.5) monsterPath.shift();
                }

                // Slow, heavy footsteps
                monsterTimer -= dt;
                if (monsterTimer <= 0) {
                    playSound(monsterFootstepBuffer, true);
                    monsterTimer = 1.5; // 1.5s interval
                }
            }

            // Update Monster Audio Panner Position
            if (monsterPanner) {
                monsterPanner.positionX.value = mPos.x;
                monsterPanner.positionY.value = mPos.y;
                monsterPanner.positionZ.value = mPos.z;
            }

            // Flashlight Intensity Lerp
            flashlight.intensity += (flashlightTargetIntensity - flashlight.intensity) * Math.min(dt * 15, 1);

            // Motion blur based on speed
            const speed = Math.hypot(velocity.x, velocity.z);
            motionBlurPass.uniforms.uStrength.value = Math.min(speed / 10.0, 1.0);

            // Update Dust
            dustMat.uniforms.uTime.value = elapsed;
            const cPos = new THREE.Vector3();
            camera.getWorldPosition(cPos);
            dustMat.uniforms.uCamPos.value.copy(cPos);
            dustMat.uniforms.uFlashlightPos.value.copy(flashlight.getWorldPosition(new THREE.Vector3()));
            dustMat.uniforms.uFlashlightDir.value.copy(flashlight.getWorldDirection(new THREE.Vector3()));
            dustMat.uniforms.uFlashlightOn.value = flashlightOn ? 1 : 0;

            composer.render();
        }

        // ============ HELPER FUNCTIONS ============
        function isInsideWall(x, z, pad) {
            const gx = (x / CELL_SIZE) + halfW + 0.5;
            const gz = (z / CELL_SIZE) + halfH + 0.5;
            const cx = Math.floor(gx), cz = Math.floor(gz);
            const fx = gx - cx, fz = gz - cz;
            const p = pad / CELL_SIZE;
            if (fz < p && cz >= 0 && cz < MAZE_H && cx >= 0 && cx < MAZE_W && wallsH[cz][cx]) return true;
            if (fz > 1-p && cz+1 < MAZE_H && wallsH[cz+1][cx]) return true;
            if (fx < p && wallsV[cz][cx]) return true;
            if (fx > 1-p && wallsV[cz][cx+1]) return true;
            return false;
        }

        // Fix initial spawn position if inside wall
        cameraRig.position.set(cellWorldX(0), STAND_HEIGHT, cellWorldZ(0));

        // Init Audio on click
        overlay.addEventListener('click', () => {
            controls.lock();
            initAudio();
            overlay.classList.add('hidden');
            hud.classList.add('visible');
            crosshair.classList.add('visible');
            flIndicator.classList.add('visible');
        });

        controls.addEventListener('unlock', () => {
            if(!gameWon) overlay.classList.remove('hidden');
        });

        // Start loop
        document.getElementById('loading').classList.add('hidden');
        overlay.style.display = 'flex';
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
